                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [role]
      summary: Create role
      operationId: createRole
      description: >
        Tiga role bawaan (`SUPERADMIN`, `CASHIER`, `INVENTARIS`) dipasang lewat
        `db/seeder_postgres/003_role.sql`, bukan endpoint ini. Endpoint ini untuk
        role tambahan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama]
              properties:
                nama:
                  type: string
                  maxLength: 64
                  description: >
                    Unik tanpa memperhatikan huruf besar-kecil, jadi `CASHIER` dan
                    `cashier` bertabrakan.
                  example: AUDITOR
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/role/{id}:
    get:
      tags: [role]
      summary: Get role by id
      operationId: getRole
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Role" }
        "404": { $ref: "#/components/responses/Error" }

    patch:
      tags: [role]
      summary: Update role
      operationId: updateRole
      description: >
        Field yang tidak dikirim tidak diubah. Kedua kolom NOT NULL, jadi `null`
        ditolak 400 untuk keduanya.


        **Hati-hati mengganti `nama`.** Nama role akan dipakai pengecekan izin
        begitu middleware otorisasi dibangun, dan mengganti nama role yang sudah
        dipakai memutus pengecekan yang mengacu nama lama. Tidak ada constraint
        database yang bisa mencegahnya. Pensiunkan dengan `is_aktif: false` lalu
        buat role baru.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nama: { type: string, maxLength: 64 }
                is_aktif: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/user:
    get:
      tags: [user]
      summary: List user
      operationId: listUser
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          description: Cocokkan sebagian pada username, nama lengkap, atau email.
          schema: { type: string, maxLength: 255 }
        - $ref: "#/components/parameters/IsAktif"
        - name: role_id
          in: query
          description: >
            Batasi ke pemegang satu role — "tampilkan semua kasir". Seorang user
            yang punya beberapa role tetap muncul satu kali; filter ini `EXISTS`,
            bukan join, supaya baris tidak berlipat sebanyak rolenya.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [user]
      summary: Create user
      operationId: createUser
      description: >
        User dan seluruh role-nya ditulis dalam satu transaksi: kalau pemberian
        role gagal, usernya juga tidak jadi dibuat. `role_ids` boleh dikosongkan —
        user tanpa role bisa dibuat lalu diberi role lewat PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 64
                  description: >
                    Unik tanpa memperhatikan huruf besar-kecil, jadi `Budi` dan
                    `budi` bertabrakan.
                  example: kasir_pagi
                email:
                  type: string
                  format: email
                  maxLength: 255
                  nullable: true
                  description: >
                    Opsional dan unik tanpa memperhatikan huruf besar-kecil.
                    Beberapa user boleh sama-sama tidak punya email — indeks unik
                    PostgreSQL tidak mengikat NULL.
                password: { $ref: "#/components/schemas/Password" }
                nama_lengkap: { type: string, maxLength: 255, nullable: true }
                role_ids: { $ref: "#/components/schemas/RoleIDs" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/user/{id}:
    get:
      tags: [user]
      summary: Get user by id
      operationId: getUser
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }

    patch:
      tags: [user]
      summary: Update user, termasuk mengatur ulang role-nya
      operationId: updateUser
      description: >
        Field yang tidak dikirim tidak diubah. Mengirim `null` pada `email` atau
        `nama_lengkap` mengosongkan kolom itu; `username`, `password`, dan
        `is_aktif` NOT NULL sehingga `null` ditolak 400.


        `role_ids` **mengganti seluruh himpunan**, bukan menambah: tidak dikirim
        berarti role dibiarkan apa adanya, `[]` mencabut semuanya, dan `[1, 3]`
        membuat user berakhir dengan tepat role 1 dan 3. `null` ditolak, karena
        `[]` sudah berarti "tanpa role".


        Role yang tetap dipegang tidak dicabut lalu diberikan ulang, jadi
        `user_role.created_at` tetap mencatat kapan pemberian itu benar-benar
        dimulai.


        Body yang hanya berisi `role_ids` tetap menggerakkan `updated_at` user —
        itu tetap perubahan pada user tersebut.


        Perubahan user dan role-nya berada dalam satu transaksi.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                username: { type: string, maxLength: 64 }
                email: { type: string, format: email, maxLength: 255, nullable: true }
                password: { $ref: "#/components/schemas/Password" }
                nama_lengkap: { type: string, maxLength: 255, nullable: true }
                is_aktif: { type: boolean }
                role_ids: { $ref: "#/components/schemas/RoleIDs" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pelanggan:
