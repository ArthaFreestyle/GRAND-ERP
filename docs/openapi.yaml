      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Satuan" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/ekspedisi:
    get:
      tags: [ekspedisi]
      summary: List ekspedisi
      operationId: listEkspedisi
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          description: Cocokkan sebagian pada nama atau telepon.
          schema: { type: string, maxLength: 255 }
        - $ref: "#/components/parameters/IsAktif"
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
