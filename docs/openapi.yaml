openapi: 3.0.3
info:
  title: GRAND-ERP API
  version: 0.9.0
  description: >
    Backend kontrak API untuk GRAND-ERP. Setiap perubahan route, request, atau
    response di internal/delivery dan internal/model harus tercermin di sini
    dalam commit yang sama.


    Data master tidak punya endpoint DELETE. Keempat tabel (satuan, supplier,
    pelanggan, ekspedisi) dirujuk tabel transaksi, jadi menghapus baris yang
    sudah dipakai akan gagal karena foreign key atau memutus jejak audit.
    Penonaktifan dilakukan lewat `PATCH` dengan `is_aktif: false`. Hal yang sama
    berlaku untuk `role` dan `user`.


    Satu user boleh punya banyak grant. Sejak isu #12 fase 3, satu grant adalah
    pasangan (role, unit_kerja): `id_unit_kerja` kosong berarti role itu berlaku
    di seluruh unit, diisi berarti hanya di unit tersebut, dan role yang sama
    boleh dipegang di lebih dari satu unit sebagai grant terpisah. Pemberian dan
    pencabutan grant dilakukan lewat `grants` di `POST`/`PATCH /api/v1/user`,
    bukan sub-resource tersendiri, supaya baris user dan pemberian grant-nya
    berada dalam satu transaksi.


    Sejak isu #12 fase 4, sebuah **sesi** (token) mengotorisasi sebagai **satu**
    grant aktif, bukan gabungan seluruh grant yang dipegang. Login dengan tepat
    satu grant usable memilihkannya otomatis; dengan lebih dari satu, token
    terbit tanpa konteks aktif dan tidak mengotorisasi apa pun sampai
    `POST /api/v1/auth/switch-context` dipanggil. Lihat endpoint itu untuk
    detailnya, termasuk kenapa token lama tetap sah sesudahnya.


    Sejak isu #12 fase 5, `id_ruang` pada `POST /api/v1/pembelian` dan
    `id_ruang_asal` pada `POST`/`PATCH /api/v1/mutasi` divalidasi terhadap
    unit_kerja aktif sesi pemanggil — di luar unit itu → 403. Konteks aktif
    global (grant tanpa unit) tidak dibatasi. `id_ruang_tujuan` pada `mutasi`
    tidak pernah dibatasi: mutasi antar unit sengaja diperbolehkan.


    Sejak isu #12 fase 6, bacaan pada `ruang`, `pembelian`,
    `penerimaan-susulan`, `retur-pembelian`, `mutasi`, dan
    `GET /product/{id}/stok` juga disaring oleh unit_kerja aktif yang sama.
    Sebuah `GET /{id}` di luar unit menjawab 404, persis seperti id yang tidak
    ada — bukan 403, supaya bacaan yang disaring tidak sengaja membocorkan
    bahwa dokumennya ada. Sebuah `GET` daftar (dan `stok`, yang berbentuk
    daftar) diam-diam melewati baris di luar unit, tanpa error. Untuk
    `mutasi`, yang diperiksa hanya `id_ruang_asal` — sama seperti fase 5 —
    jadi dokumen yang `id_ruang_tujuan`-nya di luar unit aktif tetap terlihat
    selama `id_ruang_asal`-nya cocok. Konteks aktif global tidak dibatasi di
    sini juga. Ini bagian opsional dari fase 6 ("baru kalau terbukti perlu")
    yang dibangun; `users.id_ruang_default` dan kolom snapshot role pada
    dokumen transaksi tetap ditunda.


    Isu #8 menambah sisi baca dan koreksi `product_harga_jual`, yang sebelumnya cuma
    bisa ditambah lewat `POST .../harga-jual`. `GET /product/{id}/harga-jual`
    menjawab versi yang **berlaku** pada satu tanggal, satu baris per satuan —
    bukan seluruh riwayat seperti `GET /product/{id}`. Penentuannya `WHERE`
    biasa, bukan "yang terbaru menang": `product_harga_jual_no_overlap` menjamin
    tidak pernah ada dua versi berlaku bersamaan, jadi tidak pernah ada lebih
    dari satu kandidat untuk dipilih. `PATCH`/`DELETE
    .../harga-jual/{id_harga}` mengoreksi atau menghapus satu versi, ditolak
    **409** begitu ada baris `penjualan_detail` yang merujuknya — snapshot di
    dokumen itu tidak pernah berubah, tapi `id_harga_jual` yang menunjuk baris
    yang sudah beda makna bukan snapshot lagi. `DELETE` di sini **keras**, bukan
    lunak seperti master data lain: baris yang boleh dihapus adalah baris yang
    tidak satu dokumen pun merujuknya, jadi tidak ada jejak audit yang hilang.
    Menghapus selalu membuka kembali versi sebelumnya (`berlaku_sampai`-nya)
    supaya tidak meninggalkan rentang tanggal tanpa harga sama sekali.
    `GET /product/harga-jual` (tanpa `{id}`) adalah daftar harga lintas produk,
    `LEFT JOIN` supaya produk yang belum punya harga tetap muncul.


    Seluruh `/api/v1` butuh bearer token, kecuali `POST /api/v1/auth/login`. Ambil
    tokennya dari endpoint itu lalu kirim sebagai `Authorization: Bearer <token>`.


    Otorisasi memakai nama role. Membaca terbuka untuk siapa pun yang sudah login —
    ini soal role guard, bukan seluruh jawaban sebuah bacaan: sejak fase 6 di atas,
    beberapa bacaan juga disaring lebih lanjut oleh unit_kerja aktif sesi; menulis
    dibagi menurut pemilik datanya — `INVENTARIS` untuk barang, satuan,
    ruang, ekspedisi, dan supplier, `CASHIER` untuk pelanggan. `SUPERADMIN` boleh
    apa saja. `role` dan `user` khusus `SUPERADMIN`, termasuk untuk membaca.


    `pembelian`, `penerimaan-susulan`, dan `retur-pembelian` dibagi menurut tahap
    alurnya, bukan menurut data yang disentuh. `INVENTARIS` mengetik faktur,
    menghitung barang, dan mengajukan; `SUPERADMIN` yang memposting, menolak, atau
    membatalkan. Alasannya: posting bukan penyuntingan — ia menambah baris ke
    `kartu_stok` yang bersifat append-only, jadi posting yang salah tidak bisa
    diperbaiki, hanya dibalik.


    `penerimaan-susulan` adalah kiriman kedua untuk barang yang belum datang di
    kiriman pertama. Ia **menambah stok dan tidak pernah menambah utang** — faktur
    supplier terbit penuh di kiriman pertama dan sudah dibukukan penuh di sana, jadi
    yang tersisa adalah barang, bukan uang. Nilai yang masuk adalah porsi sisa dari
    nilai faktur asli, sehingga satu faktur menyumbang persis nilainya sendiri ke
    persediaan berapa pun kali barangnya datang.


    `retur-pembelian` adalah cerminnya: dokumen yang sama-sama menunjuk baris
    `pembelian_detail` dan sama-sama menyalin harga pokoknya dari sana, hanya arah
    barangnya berlawanan. Yang bisa diretur adalah yang **benar-benar datang**
    (`qty_diterima_dasar + Σ susulan − Σ retur`), bukan yang difakturkan — barang yang
    tidak pernah datang dikejar dengan penerimaan susulan, bukan dikirim balik.


    `mutasi` adalah perpindahan barang antar `ruang`, dan dokumen pertama yang menulis
    `kartu_stok` ke **dua arah sekaligus**: satu baris detail menghasilkan
    `MUTASI_KELUAR` di ruang asal dan `MUTASI_MASUK` di ruang tujuan, dalam satu
    transaksi. Memecahnya jadi dua dokumen berarti barang bisa keluar dari gudang tanpa
    pernah masuk ke toko. Nilai yang masuk ke ruang tujuan **persis** nilai yang tercatat
    keluar dari ruang asal, sehingga total nilai persediaan tidak bergerak sedikit pun
    hanya karena barang pindah rak. Barang yang bertambah tanpa asal bukan mutasi
    melainkan stok opname.


    `mutasi` juga satu-satunya penulis `kartu_stok` yang **tidak punya `DIAJUKAN`** —
    alurnya `DRAFT → POSTED → BATAL`, tanpa `ajukan` dan `tolak`. Taruhannya jauh lebih
    kecil daripada tiga dokumen di atas: mutasi yang salah mencatat barang di ruang yang
    keliru, sementara total stok dan total nilai persediaan tidak berubah, dan
    koreksinya adalah mutasi lagi ke arah sebaliknya. Kendali dua orangnya tetap utuh
    lewat pembagian role: `INVENTARIS` hanya sampai `DRAFT`, `SUPERADMIN` yang
    memposting dan membatalkan. Konsekuensinya tidak ada lagi sinyal "draft ini sudah
    siap", jadi daftar berstatus `DRAFT` dengan `terlama_dulu=true` yang jadi antrean
    kerjanya.


    `pembayaran-utang` adalah uang yang keluar ke supplier, dan satu-satunya modul
    transaksi yang tidak menyentuh stok. Satu pembayaran boleh menutup beberapa faktur
    dan satu faktur boleh ditutup beberapa pembayaran, jadi alokasinya tabel tersendiri.
    Kelebihan bayar normal dan mengendap sebagai kredit. **Giro yang belum cair bukan
    pembayaran** — utangnya berkurang saat giro cair, bukan saat dokumennya diposting.


    Retur POSTED juga mengurangi utang, tetapi **bukan sebesar `total`-nya**: angka itu
    nilai persediaan menurut harga pokok, yang memuat porsi ongkir yang dibayar ke
    ekspedisi. Utang memakai `nilai_kredit_utang`, dihitung dari nilai faktur lalu
    diskalakan terhadap `pembelian.total` supaya diskon nota tidak ikut dikreditkan dua
    kali, dan dibekukan saat posting.


    `dokumen` adalah lampiran berkas, dan ia infrastruktur lintas modul — bukan milik
    salah satu dokumen. Alurnya **unggah dulu, tempel kemudian**: foto faktur diambil
    saat box dibongkar, ketika dokumen pembeliannya belum tentu sudah dibuat, jadi
    berkas yang baru diunggah berstatus yatim (`ref_table` dan `ref_id` masih null)
    sampai ada yang mengklaimnya lewat `POST /api/v1/dokumen/{id}/tempel`. Yang tidak
    pernah diklaim disapu worker setelah `dokumen.orphan_ttl_hours`.


    Jenis berkas ditentukan dari **isi berkasnya**, bukan dari header `Content-Type`
    maupun ekstensi nama yang dikirim klien; nama simpannya dihasilkan server, dan
    `nama_asli` hanya untuk ditampilkan. Unduhan tetap di balik autentikasi dan selalu
    disajikan sebagai lampiran — foto faktur memuat harga beli dan identitas supplier.


    Uang dan kuantitas pada modul pembelian dikirim dan diterima sebagai **string
    desimal**, bukan angka JSON. `NUMERIC(20,2)` yang lewat float JSON kehilangan
    sen, dan angka-angka ini menjadi utang ke supplier sekaligus nilai persediaan.


    Token bersifat stateless: **tidak ada cara mencabutnya.** Menonaktifkan user
    atau mencabut rolenya tidak menyentuh token yang sudah keluar, dan aksesnya
    baru hilang saat token kedaluwarsa (`jwt.ttl_minutes`, default 60 menit).


    Semantik PATCH: hanya field yang benar-benar ada di body JSON yang diubah.
    Mengirim `null` pada kolom nullable **mengosongkan** kolom itu, sedangkan
    tidak mengirim field sama sekali membiarkannya apa adanya. Untuk kolom NOT
    NULL (`nama`, `is_aktif`) `null` ditolak dengan 400. Body kosong `{}` juga
    ditolak, supaya `updated_at` tidak mencatat perubahan yang tidak terjadi.


    Kunci `data` selalu ada di setiap respons. Endpoint list mengembalikan `[]`
    saat tidak ada baris, bukan `null` dan bukan kunci yang hilang; respons gagal
    mengembalikan `"data": null` berdampingan dengan `errors`.

servers:
  # 127.0.0.1, bukan localhost: port dipublikasikan compose ke 0.0.0.0 yang hanya
  # IPv4, sedangkan localhost sering diselesaikan ke ::1 lebih dulu sehingga
  # "Try it out" gagal dengan koneksi reset padahal servernya sehat.
  - url: http://127.0.0.1:3000
    description: Local development

# Berlaku untuk seluruh operasi kecuali yang menimpanya dengan `security: []` —
# yaitu halaman dokumentasi, /health, dan login.
security:
  - bearerAuth: []

tags:
  - name: auth
  - name: dokumen
  - name: pembelian
  - name: penerimaan-susulan
  - name: retur-pembelian
  - name: pembayaran-utang
  - name: mutasi
  - name: product
  - name: periode
  - name: docs
  - name: unit-kerja
  - name: ruang
  - name: satuan
  - name: ekspedisi
  - name: supplier
  - name: pelanggan
  - name: role
  - name: user

paths:
  /:
    get:
      tags: [docs]
      summary: Swagger UI
      operationId: docsUI
      security: []
      description: >
        Halaman dokumentasi ini sendiri. Dimatikan dengan `web.swagger: false`
        (atau `WEB_SWAGGER=false`), dan saat dimatikan rutenya tidak terdaftar
        sama sekali sehingga menjawab 404, bukan halaman kosong.
      responses:
        "200":
          description: Halaman HTML Swagger UI
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Dokumentasi dimatikan lewat konfigurasi

  /openapi.yaml:
    get:
      tags: [docs]
      summary: Kontrak OpenAPI ini
      operationId: docsSpec
      security: []
      description: >
        Berkas ini, ditanam ke dalam biner dengan `go:embed` lewat `docs/docs.go`,
        disajikan apa adanya. Ikut mati bersama `web.swagger: false`.


        Tombol "Try it out" mengarah ke `servers:` di atas, yaitu
        `http://127.0.0.1:3000`. Membuka dokumentasi dari host atau port lain
        berarti daftar itu perlu disesuaikan — tidak ada yang menulis ulang spec
        saat disajikan.
      responses:
        "200":
          description: Kontrak dalam YAML
          content:
            application/yaml:
              schema: { type: string }
        "404":
          description: Dokumentasi dimatikan lewat konfigurasi

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Tukar kredensial dengan bearer token
      operationId: login
      security: []
      description: >
        Satu-satunya endpoint `/api/v1` yang tidak butuh token.


        Semua kegagalan menjawab pesan yang sama, `username or password is wrong`,
        baik usernamenya tidak ada, passwordnya salah, maupun akunnya
        `is_aktif: false`. Membedakannya memberi jalan untuk menebak username yang
        valid, dan operator tidak mendapat apa pun dari perbedaan itu.


        Username dicocokkan tanpa memperhatikan huruf besar-kecil, mengikuti
        `users_username_lower_uidx`.


        Token berisi grant yang dipegang user **saat token dibuat**, dan hanya
        yang usable — role-nya `is_aktif`, dan kalau grant-nya menyebut unit,
        unit itu juga `is_aktif`. Grant yang diberikan, dicabut, atau
        (unit/role-nya) dipensiunkan setelahnya baru terlihat pada login
        berikutnya.


        **Isu #12 fase 4 — konteks aktif.** Dengan wewenang bertempat, tidak
        ada default yang aman dipilihkan diam-diam. Memegang tepat satu grant
        usable membuatnya otomatis aktif; memegang lebih dari satu menjawab
        `aktif: null`, dan token itu **tidak mengotorisasi apa pun** sampai
        `POST /auth/switch-context` dipanggil untuk memilih salah satunya —
        lihat endpoint itu di bawah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64, example: admin }
                password: { type: string, format: password, maxLength: 72 }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Siapa yang server anggap sedang memanggil
      operationId: me
      description: >
        Membaca isi token, bukan tabel `users`. Itu memang yang dipakai server untuk
        memutuskan izin, jadi itulah yang berguna diperiksa — dan dengan token
        stateless keduanya bisa berbeda. Grant yang dicabut, atau role/unitnya
        dipensiunkan, setelah token dibuat masih muncul di sini sampai tokennya
        kedaluwarsa.
      responses:
        "200":
          description: Sesi yang sedang berlaku
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/switch-context:
    post:
      tags: [auth]
      summary: Pilih satu grant sebagai konteks aktif
      operationId: switchContext
      description: >
        Isu #12 fase 4. Menerbitkan token baru yang beraksi sebagai `id_user_role`
        yang disebut — tidak ada role guard di endpoint ini, karena sesi tanpa
        konteks aktif memang tidak mengotorisasi apa pun sama sekali, jadi tidak
        ada yang perlu dijaga selain autentikasi.


        Grant-nya dibaca ulang dari database saat itu juga, **tidak pernah
        dipercaya dari klaim token pemanggil sendiri** — satu-satunya titik di
        seluruh desain ini di mana kebasian token dibiarkan berpengaruh. Setiap
        kegagalan menjawab **403 yang sama**: grant tidak ada, grant milik user
        lain, rolenya sudah `is_aktif: false`, atau unitnya sudah
        `is_aktif: false`. Membedakannya memberi jalan menebak id grant milik
        orang lain, persis alasan `POST /auth/login` menjawab satu pesan untuk
        setiap kegagalan.


        **Token lama tetap sah.** Menukar konteks menerbitkan token baru; ia
        tidak mencabut yang lama, dan tidak bisa — desainnya JWT stateless.
        Token sebelumnya, dengan wewenang lamanya, tetap berlaku sampai
        kedaluwarsa (`jwt.ttl_minutes`). Konteks aktif adalah kendali
        kejelasan dan least-privilege, bukan batas keamanan terhadap pemegang
        tokennya sendiri.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_user_role]
              properties:
                id_user_role: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Token baru dengan konteks aktif yang dipilih
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /health:
    get:
      summary: Liveness probe
      operationId: health
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/dokumen:
    post:
      tags: [dokumen]
      summary: Unggah satu lampiran berkas
      operationId: uploadDokumen
      description: >
        Menyimpan satu berkas dan mengembalikan metadatanya. Barisnya lahir **yatim**:
        `ref_table` dan `ref_id` masih null sampai ada yang menempelkannya lewat
        `POST /api/v1/dokumen/{id}/tempel`. Itu memang alurnya — foto faktur diambil
        sebelum dokumen pembeliannya tentu sudah ada.


        Yang diterima hanya JPEG, PNG, dan PDF, dan **jenisnya ditentukan dari isi
        berkas** (magic bytes), bukan dari header `Content-Type` atau ekstensi nama
        yang dikirim klien — keduanya sepenuhnya dikendalikan pemanggil. Berkas HTML
        yang diberi nama `faktur.pdf` ditolak 400.


        `nama_asli` disimpan apa adanya untuk ditampilkan dan **tidak pernah menjadi
        path**; nama simpan di server dihasilkan sendiri (UUID + ekstensi hasil
        deteksi). Batas ukuran (`dokumen.max_size_mb`, default 10 MB) ditegakkan saat
        berkasnya mengalir, bukan setelah utuh masuk memori.


        `created_by` diambil dari token, tidak pernah dari body.


        `duplikat_dari_id` terisi ketika sudah ada lampiran hidup dengan checksum yang
        sama. Itu peringatan, bukan penolakan: satu hasil scan sah saja ditempel ke dua
        dokumen berbeda.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas:
                  type: string
                  format: binary
                  description: JPEG, PNG, atau PDF. Maksimal `dokumen.max_size_mb`.
      responses:
        "201":
          description: Berkas tersimpan, masih yatim
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Dokumen" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Error" }
        "413":
          description: >
            Body melebihi batas transport. Batas Fiber diturunkan dari
            `dokumen.max_size_mb` plus satu MB untuk overhead multipart, jadi berkas
            yang hanya sedikit melewati batas tetap ditolak 400 dengan pesan yang
            menjelaskan — 413 berarti jauh lebih besar dari itu.

    get:
      tags: [dokumen]
      summary: Daftar lampiran satu dokumen, atau berkas yatim milik sendiri
      operationId: listDokumen
      description: >
        Dua mode, dipilih dari ada tidaknya referensi:


        - `ref_table` + `ref_id` diisi — lampiran dokumen itu.

        - keduanya kosong — berkas yang **pemanggil sendiri** unggah dan belum
          ditempelkan ke mana pun. Itulah yang dibutuhkan layar penerimaan untuk
          menawarkan foto yang baru diambil beberapa menit lalu.


        Mengisi salah satunya saja ditolak 400: setengah referensi menunjuk satu tabel
        utuh atau tidak menunjuk apa pun. Baris yang sudah dihapus tidak pernah ikut.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: ref_table
          in: query
          description: Harus salah satu jenis dokumen yang dikenal; selain itu 400.
          schema:
            type: string
            enum: [pembelian, penerimaan_susulan, retur_pembelian, pembayaran_utang]
        - name: ref_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Halaman hasil, terbaru dulu
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Dokumen" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/dokumen/{id}:
    get:
      tags: [dokumen]
      summary: Unduh isi berkas
      operationId: getDokumenIsi
      description: >
        Mengalirkan isi berkasnya, bukan JSON. Tetap di balik autentikasi seperti
        endpoint lain — foto faktur memuat harga beli dan identitas supplier.


        Selalu disajikan sebagai unduhan: `Content-Disposition: attachment` dan
        `X-Content-Type-Options: nosniff`, sehingga HTML atau SVG yang entah bagaimana
        tersimpan tidak bisa dieksekusi di origin aplikasi. `Cache-Control:
        private, no-store` menjaganya tidak mengendap di cache bersama.


        Lampiran yang sudah dihapus menjawab 404: barisnya masih ada sebagai jejak,
        berkasnya tidak.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Isi berkas
          headers:
            Content-Disposition:
              schema: { type: string }
              description: >
                Selalu `attachment`. Nama asli dibawa di parameter `filename*`
                (RFC 5987); bentuk berkutip hanya ASCII aman, karena `nama_asli`
                berasal dari klien dan kutip atau baris baru di header adalah
                penyuntikan header.
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

    delete:
      tags: [dokumen]
      summary: Hapus lampiran (soft delete)
      operationId: deleteDokumen
      description: >
        Satu-satunya DELETE di API ini, dan ia **soft delete**: berkasnya dihapus dari
        disk, barisnya bertahan dengan `deleted_at` terisi. Jejak bahwa pernah ada
        unggahan lebih berharga daripada satu baris yang dihemat.


        Hanya boleh selama berkasnya **masih yatim atau dokumen induknya `DRAFT`**.
        Setelah dokumennya diajukan, foto faktur yang jadi dasar persetujuan adalah
        bagian dari rekaman, bukan milik pengunggah untuk ditarik kembali — 409.


        Menghapus dua kali menjawab 409, bukan 200: barisnya masih ada dan sudah
        ditandai.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Berkas terhapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Dokumen" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/dokumen/{id}/tempel:
    post:
      tags: [dokumen]
      summary: Tempelkan lampiran ke dokumen induknya
      operationId: tempelDokumen
      description: >
        Paruh kedua dari "unggah dulu, tempel kemudian", dan satu-satunya cara sebuah
        baris berhenti menjadi calon sapuan cronjob.


        Satu endpoint di modul ini, bukan field di setiap dokumen: modul yang mulai
        menerima lampiran cukup ditambahkan ke whitelist `ref_table` dan tidak perlu
        mengubah DTO-nya sendiri. Tidak ada foreign key di balik referensi polimorfik,
        jadi whitelist itulah yang memastikan `ref_table` menyebut dokumen sungguhan —
        nilai di luar daftar menjawab 400, dan `ref_id` yang tidak menunjuk baris mana
        pun juga 400.


        Ditolak 409 kalau lampirannya sudah tertempel ke dokumen lain (memindahkannya
        berarti diam-diam mencabut bukti dari dokumen yang memilikinya), kalau dokumen
        induknya sudah `BATAL`, atau kalau induknya sudah memegang 10 lampiran.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref_table, ref_id]
              properties:
                ref_table:
                  type: string
                  enum: [pembelian, penerimaan_susulan, retur_pembelian, pembayaran_utang]
                ref_id: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Lampiran tertempel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Dokumen" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/product:
    get:
      tags: [product]
      summary: List product
      operationId: listProduct
      description: >
        Tidak menyertakan `satuan` maupun `harga_jual` — mengambilnya berarti satu query
        per baris. Kuncinya hilang sama sekali, bukan array kosong. Pakai endpoint detail
        untuk keduanya.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          description: Cocokkan sebagian pada nama atau kode barang.
          schema: { type: string, maxLength: 255 }
        - $ref: "#/components/parameters/IsAktif"
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [product]
      summary: Buat produk beserta satuan konversinya
      operationId: createProduct
      description: >
        Produk dan seluruh baris `product_satuan` ditulis dalam satu transaksi.


        **Satuan dasar didaftarkan otomatis dengan `faktor = 1`** dari `id_satuan_dasar`,
        jadi `satuan` boleh dikosongkan dan produk tidak pernah berakhir tanpa satuan
        dasar. Menyebut satuan dasar sekali lagi di dalam `satuan` diperbolehkan dan
        melebur ke baris otomatis itu; menyebutnya dengan `faktor` selain 1 ditolak 400.


        `created_by` diambil dari token, tidak pernah dari body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode_barang, nama, id_satuan_dasar]
              properties:
                kode_barang:
                  type: string
                  maxLength: 64
                  description: Unik. Duplikat menjawab 409.
                  example: BRG-001
                nama: { type: string, maxLength: 255, example: Kertas A4 }
                id_satuan_dasar:
                  type: integer
                  format: int64
                  minimum: 1
                  description: >
                    Harus ada di tabel `satuan`; id yang tidak dikenal menjawab 400, bukan
                    500.
                stok_minimum: { type: integer, format: int64, minimum: 0, default: 0 }
                satuan:
                  type: array
                  maxItems: 32
                  items: { $ref: "#/components/schemas/ProductSatuanInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/product/{id}:
    get:
      tags: [product]
      summary: Detail produk, dengan satuan dan riwayat harga jual
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Error" }

    patch:
      tags: [product]
      summary: Update product
      operationId: updateProduct
      description: >
        Hanya `nama`, `stok_minimum`, dan `is_aktif`. Ketiganya NOT NULL, jadi `null`
        ditolak 400.


        **`kode_barang` dan `id_satuan_dasar` tidak bisa diubah** dan tidak ada di body.
        `kode_barang` mengidentifikasi barang di setiap dokumen yang merujuknya, jadi
        menggantinya menulis ulang makna dokumen lama. `id_satuan_dasar` lebih parah:
        mengubahnya membatalkan seluruh `faktor` di `product_satuan` dan setiap kuantitas
        yang sudah diposting ke `kartu_stok` dalam satuan dasar lama. Pensiunkan dengan
        `is_aktif: false` lalu buat produk baru.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nama: { type: string, maxLength: 255 }
                stok_minimum: { type: integer, format: int64, minimum: 0 }
                is_aktif: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/product/{id}/satuan:
    post:
      tags: [product]
      summary: Tambah satuan konversi
      operationId: addProductSatuan
      description: >
        Mengirim satuan yang sudah terdaftar memperbarui `faktor`-nya, bukan menolak —
        supaya respons sukses tidak pernah berarti konversi tersimpan berbeda dari yang
        diminta.


        `is_default_input: true` **memindahkan** penanda default: yang lama dibersihkan
        lebih dulu di transaksi yang sama, karena `product_satuan_default_uidx` hanya
        mengizinkan satu baris bertanda per produk.


        Satuan dasar hanya boleh `faktor = 1`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductSatuanInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/product/{id}/harga-jual:
    get:
      tags: [product]
      summary: Versi harga yang berlaku, per satuan, pada satu tanggal
      operationId: getHargaJualBerlaku
      description: >
        Isu #8 fase 1 — ini yang sebelumnya tidak ada dan menghalangi `penjualan`:
        `penjualan_detail.id_harga_jual` mereferensi satu baris versi, bukan sebuah
        angka, dan sebelum endpoint ini satu-satunya cara mengetahuinya adalah membuka
        `GET /product/{id}` dan menyerahkan pemilihan "mana yang berlaku" ke klien.


        Satu baris per satuan yang punya harga berlaku pada `tanggal`.
        Penentuannya `WHERE` biasa (`berlaku_dari <= tanggal AND (berlaku_sampai IS
        NULL OR berlaku_sampai > tanggal)`), bukan "yang terbaru menang" — karena
        `product_harga_jual_no_overlap` menjamin tidak pernah ada dua versi berlaku
        bersamaan, tidak pernah ada lebih dari satu kandidat untuk dipilih. Kalau
        exclusion constraint itu suatu hari dilonggarkan, resolver ini ikut jadi
        ambigu.


        `tanggal` opsional, format `YYYY-MM-DD`, default hari ini di WIB
        (`Asia/Jakarta`, offset tetap +7 karena tidak ada DST). Ini bukan konversi
        `TIMESTAMPTZ` — pemanggil menyebut tanggal kalender secara langsung — tapi
        default "hari ini" tetap harus diputuskan di zona waktu yang sama supaya
        transaksi lewat tengah malam WIB tidak salah harga.


        Produk yang tidak dikenal menjawab **404**; produk yang belum punya harga
        berlaku pada tanggal itu — termasuk yang belum punya harga sama sekali —
        menjawab daftar kosong. Dua fakta berbeda, sama seperti argumen di
        `riwayat_beli`.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: tanggal
          in: query
          description: Default hari ini di WIB.
          schema: { type: string, format: date, example: "2026-08-14" }
      responses:
        "200":
          description: Versi yang berlaku, satu baris per satuan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HargaJualBerlaku" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

    post:
      tags: [product]
      summary: Buka versi harga jual baru
      operationId: addProductHargaJual
      description: >
        Versi yang masih terbuka untuk produk dan satuan yang sama ditutup pada
        `berlaku_dari`, di transaksi yang sama. Rentangnya setengah terbuka, jadi menutup
        pada tanggal itu tidak meninggalkan celah maupun tumpang tindih — harga lama
        berlaku sampai tanggal itu, harga baru mulai dari tanggal itu.


        Periode yang tumpang tindih menjawab **409**, ditegakkan exclusion constraint
        `product_harga_jual_no_overlap`. Itu satu-satunya penjaga yang nyata: pemeriksaan
        tumpang tindih melintasi baris, jadi pengecekan di aplikasi tidak bisa
        menggantikannya.


        `id_satuan` harus sudah terdaftar di `product_satuan` — harga untuk satuan yang
        tidak dijual tidak akan pernah muncul di layar input. Tidak ada foreign key yang
        menjaga itu, jadi ditolak 400 di usecase.


        `product_harga_jual` hanya sumber pengisian harga otomatis. Harga yang
        benar-benar ditagih disalin sebagai snapshot ke `penjualan_detail`, jadi mengubah
        harga master tidak pernah menyentuh transaksi lama.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_satuan, harga, berlaku_dari]
              properties:
                id_satuan: { type: integer, format: int64, minimum: 1 }
                harga: { $ref: "#/components/schemas/Harga" }
                berlaku_dari: { type: string, format: date, example: "2026-01-01" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/product/{id}/harga-jual/{id_harga}:
    patch:
      tags: [product]
      summary: Koreksi harga pada versi yang sudah ada
      operationId: updateProductHargaJual
      description: >
        Isu #8 fase 2. Hanya `harga`: `id_satuan` dan `berlaku_dari` tidak ada di body
        dan tidak bisa diubah lewat endpoint ini, karena `berlaku_dari` menggeser
        rentang tanggal dan bisa menabrak versi tetangganya. Koreksi untuk itu adalah
        hapus lalu ketik ulang (`DELETE` di path yang sama), dan itu memang yang
        seharusnya terlihat di jejak.


        Ditolak **409** begitu ada baris `penjualan_detail` yang merujuk
        `id_harga`. `penjualan_detail.harga_satuan_input` sudah menyimpan snapshot,
        jadi mengubah baris master ini tidak pernah mengubah nilai nota mana pun —
        tapi ia membuat `id_harga_jual` menunjuk baris yang tidak lagi menyatakan apa
        yang ditagih, dan itu satu-satunya jejak "harga ini datang dari daftar harga
        versi mana".
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IDHarga"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [harga]
              properties:
                harga: { $ref: "#/components/schemas/Harga" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

    delete:
      tags: [product]
      summary: Hapus satu versi harga dan buka kembali versi sebelumnya
      operationId: deleteProductHargaJual
      description: >
        Isu #8 fase 2. **`DELETE` di sini keras, bukan lunak** — pengecualian ketiga
        atas aturan "master data tidak punya `DELETE`", setelah `user_role` dan
        `dokumen`. Baris yang boleh dihapus adalah baris yang tidak satu dokumen pun
        merujuknya (dijaga syarat 409 yang sama seperti `PATCH`), jadi tidak ada jejak
        audit yang hilang — tidak ada yang pernah memakainya.


        Menghapus **selalu** membuka kembali versi sebelumnya dalam transaksi yang
        sama: `berlaku_sampai` versi itu dikembalikan ke `berlaku_sampai` milik versi
        yang dihapus (`null` kalau versi yang dihapus itu yang terbuka). Tanpa ini,
        menghapus versi yang baru akan meninggalkan **lubang** — rentang tanggal tanpa
        harga sama sekali, dan `GET .../harga-jual` akan menjawab "tidak ada harga"
        untuk produk yang jelas-jelas punya. Versi paling pertama sebuah produk tidak
        punya versi sebelumnya untuk dibuka kembali — itu bukan galat, cuma tidak ada
        apa-apa untuk dilakukan.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IDHarga"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/product/harga-jual:
    get:
      tags: [product]
      summary: Daftar harga lintas produk
      operationId: listDaftarHargaJual
      description: >
        Isu #8 fase 3 — sebuah read yang bukan modul, ikut pola `riwayat_beli`: tidak
        ada tabel baru, tidak ada migrasi, satu query di repository yang sudah
        memiliki `product_harga_jual`.


        Satu baris per produk + satuan yang punya harga berlaku pada `tanggal`
        (default hari ini di WIB, sama seperti `GET /product/{id}/harga-jual`),
        **plus** satu baris per produk yang belum punya harga sama sekali —
        `LEFT JOIN`, bukan `JOIN`, karena produk tanpa harga justru yang paling perlu
        muncul di sini. Untuk baris seperti itu, `id_satuan`, `id_harga_jual`, `harga`,
        `berlaku_dari`, dan `berlaku_sampai` semuanya `null`.


        Ini yang dicetak jadi daftar harga dan yang dipakai memeriksa produk mana yang
        belum punya harga sama sekali — pertanyaan yang tanpa endpoint ini hanya bisa
        dijawab dengan membuka produk satu per satu.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
        - name: tanggal
          in: query
          description: Default hari ini di WIB.
          schema: { type: string, format: date, example: "2026-08-14" }
        - $ref: "#/components/parameters/IsAktif"
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DaftarHargaJual" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/product/{id}/riwayat-beli:
    get:
      tags: [product]
      summary: Harga beli terakhir per supplier
      operationId: listRiwayatBeliProduct
      description: >
        Pengganti purchase order. Yang sebenarnya dibutuhkan sebelum memesan bukan
        dokumen pesanan melainkan perbandingan harga, dan datanya sudah terkumpul
        sendiri: setiap `pembelian` yang diposting adalah harga yang **benar-benar
        dibayar**, bukan yang dijanjikan di chat. Tidak ada yang perlu diinput dan tidak
        ada yang bisa jadi tidak sinkron.


        Satu baris per supplier — pembelian **terakhir** supplier itu atas produk ini,
        bukan satu baris per dokumen. Diurutkan dari yang terbaru.


        Hanya dokumen **POSTED** yang dihitung. Draft cuma kertas yang sudah diketik dan
        dokumen BATAL adalah pembelian yang ditarik kembali; keduanya bukan harga yang
        pernah dibayar siapa pun.


        Produk yang tidak dikenal menjawab **404**, produk yang belum pernah dibeli
        menjawab halaman kosong. Keduanya fakta yang berbeda.


        Dua harga, dan keduanya tidak saling menggantikan — lihat skema `RiwayatBeli`.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: id_supplier
          in: query
          description: >
            Persempit ke satu supplier. Itu yang dipakai layar input pembelian: header-nya
            sudah menyebut supplier, jadi pertanyaan yang berguna di sana adalah "terakhir
            saya bayar berapa ke supplier ini", bukan "semua orang menjual berapa".
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RiwayatBeli" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/product/{id}/stok:
    get:
      tags: [product]
      summary: Saldo dan nilai persediaan produk ini per ruang
      operationId: listStokProduct
      description: >
        Bacaan langsung atas `kartu_stok`, yang merupakan satu-satunya sumber kebenaran
        stok — tidak ada tabel master yang menyimpan kolom stok dan tidak ada yang
        dihitung dengan menjumlahkan dokumen.


        Layar input mutasi tidak bisa dipakai tanpa ini: orang harus tahu ruang asal
        punya berapa sebelum mengetik. Penjualan, pemakaian, dan stok opname akan
        memakainya juga.


        **Ini bacaan, bukan penjaga.** Angkanya bisa sudah basi sebelum klien
        menindaklanjutinya; yang memutuskan saldo adalah trigger `kartu_stok`, di dalam
        advisory lock, justru supaya tidak ada pembaca yang bisa mendahuluinya. Tampilkan
        angkanya, jangan jadikan dasar keputusan.


        Tidak ada paginasi, berbeda dengan setiap daftar lain di API ini: jawabannya satu
        baris per ruang yang pernah dilalui produk ini, `ruang` tabel master yang isinya
        sedikit, dan setiap pemakainya menginginkan semuanya sekaligus untuk memilih
        ruang asal.


        Ruang yang belum pernah dilalui produk ini tidak muncul; ruang yang pernah
        dilalui lalu habis tetap muncul dengan nilai nol, karena itu fakta tentang ke
        mana barangnya pergi. Produk yang tidak dikenal menjawab **404**, produk yang
        belum pernah bergerak menjawab array kosong — keduanya fakta yang berbeda.


        Isu #12 fase 6: ruang di luar unit_kerja aktif sesi pemanggil dilewati
        begitu saja, tanpa error — sama seperti daftar lain yang disaring.
        Konteks aktif global melihat semua ruang seperti biasa.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Saldo per ruang, diurutkan menurut nama ruang
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StokRuang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian:
    get:
      tags: [pembelian]
      summary: List pembelian
      operationId: listPembelian
      description: >
        Tidak menyertakan `detail` — mengambilnya berarti satu query per baris.
        Kuncinya hilang sama sekali, bukan array kosong. Pakai endpoint detail
        untuk barisnya.


        Diurutkan `tanggal DESC, id DESC`. Pemecah seri yang unik itu wajib: banyak
        dokumen bertanggal sama, dan tanpa pemecah seri satu baris bisa muncul di
        dua halaman sementara baris lain tidak pernah keluar.


        Isu #12 fase 6: dokumen yang ruangnya di luar unit_kerja aktif sesi
        pemanggil dilewati begitu saja, tanpa error — `total_item` sudah
        menghitung setelah penyaringan ini.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          description: Cocokkan sebagian pada nomor dokumen atau no faktur supplier.
          schema: { type: string, maxLength: 255 }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        - name: status_penerimaan
          in: query
          schema: { type: string, enum: [LENGKAP, KURANG] }
        - name: id_supplier
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: tanggal_dari
          in: query
          description: Inklusif, satu hari penuh.
          schema: { type: string, format: date }
        - name: tanggal_sampai
          in: query
          description: Inklusif, satu hari penuh sampai tengah malam berikutnya.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Pembelian" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [pembelian]
      summary: Buat draft pembelian beserta barisnya
      operationId: createPembelian
      description: >
        Dokumen selalu dibuat sebagai `DRAFT`; `status` tidak ada di body sama
        sekali. Stok bergerak saat posting dan hanya saat posting.


        **Nomor dokumen digenerate server** dengan format `BL/2026/08/0001`,
        mereset tiap bulan mengikuti `tanggal` dokumen — faktur Juli yang baru
        diketik bulan Agustus tetap dapat nomor Juli. Counter-nya diambil dengan
        satu `INSERT ... ON CONFLICT DO UPDATE RETURNING` di dalam transaksi
        dokumen, jadi dua request bersamaan antre alih-alih menghasilkan nomor
        kembar. Nomor bisa berlubang kalau transaksinya rollback; itu jauh lebih
        murah daripada dua dokumen bernomor sama.


        **`qty_diterima` boleh dikosongkan** dan artinya sama dengan `qty_faktur`
        — kasus biasa di mana semua yang tertulis memang ada di dalam box.
        Mengisinya adalah cara mencatat kiriman kurang, dan saat berbeda
        `keterangan_selisih` jadi wajib.


        `qty_diterima` **tidak boleh melebihi** `qty_faktur`: barang yang tidak
        difakturkan tidak punya nilai, sehingga `nilai_masuk` proporsionalnya akan
        melebihi nilai faktur dan rata-rata bergerak jadi salah permanen.


        `faktor_konversi` diambil dari `product_satuan` dan disimpan sebagai
        snapshot. Satuan yang belum terdaftar di produk itu ditolak 400 — tidak ada
        foreign key yang mengikat `id_satuan_input` ke `product_satuan`.
        `qty x faktor` juga harus bilangan bulat, karena `qty_dasar` bertipe
        `BIGINT`.


        `subtotal`, `total`, `biaya_angkut`, dan `status_penerimaan` dihitung ulang
        server dari barisnya; mengirimnya tidak ada gunanya. `biaya_angkut =
        total_koli x tarif_per_koli` dan **bukan** bagian dari `total` — itu
        tagihan ekspedisi, bukan utang ke supplier.


        `created_by` diambil dari token, tidak pernah dari body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tanggal, id_supplier, id_ruang, detail]
              properties:
                tanggal: { type: string, format: date, example: "2026-08-11" }
                id_supplier: { type: integer, format: int64, minimum: 1 }
                id_ruang:
                  type: integer
                  format: int64
                  minimum: 1
                  description: >
                    Ruang tujuan seluruh baris. Satu dokumen tidak bisa masuk ke dua
                    ruang.


                    Isu #12 fase 5: divalidasi terhadap unit_kerja aktif sesi
                    pemanggil. Konteks aktif global (grant tanpa unit, bentuk
                    SUPERADMIN) tidak dibatasi; konteks aktif yang menyebut
                    satu unit hanya boleh memilih ruang di unit itu, kalau
                    tidak → 403.
                no_faktur_supplier:
                  type: string
                  nullable: true
                  maxLength: 64
                  description: >
                    Unik per supplier dan tidak peduli huruf besar-kecil. Tanpa
                    purchase order, ini satu-satunya jejak faktur supplier — nota
                    yang sama diinput dua kali akan menaikkan stok dua kali. Dokumen
                    `BATAL` melepas nomornya kembali. Boleh kosong, dan berapa pun
                    dokumen boleh sama-sama kosong.
                tanggal_faktur: { type: string, format: date, nullable: true }
                diskon_nota:
                  type: string
                  description: Desimal. Tidak boleh melebihi subtotal.
                  example: "0"
                ppn: { type: string, example: "0" }
                ppn_dikreditkan:
                  type: boolean
                  default: false
                  description: >
                    `false` berarti PPN ikut masuk harga pokok; `true` berarti jadi
                    pajak masukan dan tidak menyentuh harga pokok.
                pembulatan:
                  type: string
                  description: Boleh negatif — ini baris pembulatan nota.
                  example: "0"
                id_ekspedisi: { type: integer, format: int64, nullable: true, minimum: 1 }
                no_resi: { type: string, nullable: true, maxLength: 64 }
                total_koli: { type: string, nullable: true, example: "3" }
                tarif_per_koli: { type: string, nullable: true, example: "50000" }
                ditanggung_supplier:
                  type: boolean
                  default: false
                  description: >
                    `true` berarti ongkir sudah termasuk nota supplier dan **tidak
                    dialokasikan lagi** — mengalokasikannya berarti rupiah yang sama
                    masuk harga pokok dua kali.
                metode_alokasi_angkut:
                  type: string
                  enum: [KOLI, QTY]
                  default: KOLI
                jenis_pembayaran:
                  type: string
                  enum: [TUNAI, KREDIT]
                  default: TUNAI
                detail:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/PembelianDetailInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian/{id}:
    get:
      tags: [pembelian]
      summary: Detail pembelian beserta barisnya
      operationId: getPembelian
      description: >
        Isu #12 fase 6: dokumen yang ruangnya di luar unit_kerja aktif sesi
        pemanggil menjawab 404, sama seperti id yang tidak ada. Konteks aktif
        global tidak dibatasi.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

    patch:
      tags: [pembelian]
      summary: Ubah header pembelian
      operationId: updatePembelian
      description: >
        **Hanya saat `DRAFT`.** Status lain menjawab 409; dokumen yang sudah
        diajukan tertutup untuk diedit, dan itulah gunanya mengajukan.


        `nomor`, `id_supplier`, dan `id_ruang` tidak ada di sini dengan sengaja.
        Nomor mengidentifikasi dokumen, supplier menentukan utangnya milik siapa,
        dan ruang menentukan saldo stok mana yang disentuh setiap barisnya.
        Batalkan lalu input ulang kalau salah satu keliru.


        Total header dihitung ulang setelah patch, karena `diskon_nota`, `ppn`,
        `pembulatan`, `total_koli`, dan `tarif_per_koli` semuanya memberi makan
        angka itu.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggal: { type: string, format: date }
                no_faktur_supplier: { type: string, nullable: true, maxLength: 64 }
                tanggal_faktur: { type: string, format: date, nullable: true }
                diskon_nota: { type: string }
                ppn: { type: string }
                ppn_dikreditkan: { type: boolean }
                pembulatan: { type: string }
                id_ekspedisi: { type: integer, format: int64, nullable: true }
                no_resi: { type: string, nullable: true }
                total_koli: { type: string, nullable: true }
                tarif_per_koli: { type: string, nullable: true }
                ditanggung_supplier: { type: boolean }
                metode_alokasi_angkut: { type: string, enum: [KOLI, QTY] }
                jenis_pembayaran: { type: string, enum: [TUNAI, KREDIT] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian/{id}/detail:
    put:
      tags: [pembelian]
      summary: Ganti seluruh baris pembelian
      operationId: replacePembelianDetail
      description: >
        `PUT`, bukan `PATCH`: barisnya diganti sekaligus. Baris satu dokumen adalah
        satu kesatuan yang diketik ulang dari satu lembar kertas, dan edit sebagian
        akan meninggalkan total header berbeda dari barisnya di antara request.


        **Hanya saat `DRAFT`.** Baris yang sudah diposting adalah yang ditunjuk
        `retur_pembelian_detail` dan sumber harga pokok setiap pembalikan, jadi
        menghapusnya akan memutus jejak audit.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detail]
              properties:
                detail:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/PembelianDetailInput" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian/{id}/bagi-rata-koli:
    post:
      tags: [pembelian]
      summary: Bagi total_koli proporsional ke qty_dasar
      operationId: bagiRataKoliPembelian
      description: >
        Membagi `total_koli` ke seluruh baris sebanding `qty_dasar`, dan hasilnya
        berjumlah **persis** `total_koli`.


        Ada karena posting menolak dokumen yang jumlah kolinya tidak cocok, dan
        mengetik jatah per baris dengan tangan persis jenis aritmetika yang
        menghasilkan dokumen meleset 0,01. Butuh `total_koli` sudah terisi, dan
        hanya berlaku saat `DRAFT`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Dibagi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian/{id}/ajukan:
    post:
      tags: [pembelian]
      summary: Ajukan draft untuk disetujui
      operationId: ajukanPembelian
      description: >
        `DRAFT` → `DIAJUKAN`. Tanpa body: semua yang dibutuhkan sudah ada di
        dokumen. Setelah ini dokumen tertutup untuk diedit, dan jalan keluarnya
        hanya posting atau penolakan. Dokumen tanpa baris ditolak 400.


        Role: `INVENTARIS` atau `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Diajukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian/{id}/tolak:
    post:
      tags: [pembelian]
      summary: Tolak pengajuan, kembalikan ke DRAFT
      operationId: tolakPembelian
      description: >
        `DIAJUKAN` → `DRAFT`, dengan `alasan_tolak` terisi dan penanda pengaju
        dikosongkan — pengajuan berikutnya adalah pengajuan baru.


        `alasan` wajib: penolakan tanpa alasan tidak memberi operator apa pun untuk
        diperbaiki, dan catatan itu satu-satunya jalur balik.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Ditolak
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian/{id}/posting:
    post:
      tags: [pembelian]
      summary: Setujui dan tulis ke kartu stok
      operationId: postingPembelian
      description: >
        `DIAJUKAN` → `POSTED`. Satu transaksi menghitung alokasi ongkir, menulis
        `alokasi_biaya` dan `harga_pokok_satuan_dasar` ke setiap baris, menambah
        satu baris `kartu_stok` per baris yang benar-benar menerima barang, dan
        menutup dokumen.


        **Nilai yang masuk kartu stok proporsional terhadap yang datang, bukan
        nilai faktur penuh.** Faktur 100 pcs senilai 1.050.000 yang datang 95
        masuk sebagai 997.500, bukan 1.050.000. Ini yang paling mudah salah dan
        akibatnya permanen: `kartu_stok` memakai rata-rata bergerak, baris keluar
        mengunci harga pokok yang berlaku saat itu, dan penjualan yang terjadi
        sebelum susulan datang akan membukukan harga pokok yang melambung itu
        secara permanen. Tabelnya append-only — tidak bisa diperbaiki, hanya
        dibalik.


        Baris yang tidak menerima apa pun tidak ditulis ke kartu stok sama sekali.


        Ditolak 400 kalau jumlah `jumlah_koli` seluruh baris tidak sama dengan
        `total_koli`, kalau `diskon_nota` melebihi subtotal, kalau periode dokumen
        berstatus `TUTUP`, atau kalau saldo stok tidak mencukupi. Bulan tanpa baris
        `periode` dihitung terbuka.


        Periode yang tertutup diperiksa lebih dulu di Go supaya pesannya menyebut
        bulannya — "periode 2026-07 sudah TUTUP". Yang menegakkannya tetap trigger
        `kartu_stok`, dan penutupan yang commit di sela pemeriksaan dan penulisan tetap
        tertangkap di sana, hanya dengan pesan yang lebih kabur.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian/{id}/batal:
    post:
      tags: [pembelian]
      summary: Batalkan dokumen POSTED dengan baris pembalik
      operationId: batalPembelian
      description: >
        `POSTED` → `BATAL`. Tidak ada `DELETE` di modul ini: pembatalan menambah
        satu baris `kartu_stok` pembalik untuk setiap pergerakan yang dibuat
        dokumen ini, dengan `id_kartu_stok_asal` menunjuk baris aslinya. Tidak ada
        yang dihapus dan tidak ada yang diubah — `kartu_stok` melarang keduanya
        lewat trigger.


        **Catatan penting soal nilainya:** baris pembalik dinilai pada rata-rata
        bergerak yang berlaku sekarang, bukan pada harga pokok baris aslinya.
        Trigger `kartu_stok_hitung_saldo` menimpa `nilai_keluar` dan
        `harga_pokok_satuan` setiap baris keluar dengan saldo yang berlaku saat
        itu, jadi harga pokok yang dikirim aplikasi diabaikan. Kalau barangnya
        sudah bercampur dengan stok lama dan sebagian terjual, pembalikannya
        mengeluarkan harga pokok campuran. Itu sifat metode rata-rata bergerak,
        bukan jalan pintas di sini.


        **Catatan penting soal tanggalnya:** baris pembalik bertanggal **hari ini**,
        bukan tanggal dokumennya. Akibatnya membatalkan dokumen yang periodenya sudah
        ditutup tetap berhasil — pembaliknya jatuh di periode berjalan yang masih
        terbuka, dan angka bulan tertutupnya tidak bergeser sedikit pun. Itu perlakuan
        akuntansi yang lazim: koreksi atas periode tertutup dibukukan di periode
        berjalan, bukan dengan membongkar yang sudah ditutup, dan sebaliknya akan
        membuat dokumen salah ketik dari bulan tertutup tidak punya jalan keluar sama
        sekali.


        Yang perlu diketahui klien: setelah itu **status dokumen tidak lagi sinkron
        dengan buku bulan tersebut**. Dokumennya `BATAL`, sementara kartu stok bulan
        tertutup masih memuat pergerakannya, diimbangi baris pembalik di bulan lain.
        Laporan per periode harus membaca `kartu_stok`, bukan status dokumen.


        Ditolak 400 kalau stok sudah terpakai sehingga saldo akan negatif, atau kalau
        **periode berjalan** yang sedang `TUTUP` — bukan periode dokumennya. Kalau itu
        terjadi, tidak ada tempat membukukan koreksinya sampai ada yang membuka bulan
        berjalan kembali.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan_batal]
              properties:
                alasan_batal:
                  type: string
                  maxLength: 500
                  description: >
                    Wajib. Pembalikan yang tidak dijelaskan siapa pun tidak bisa
                    dibedakan dari kekeliruan, dan `kartu_stok` menyimpan keduanya
                    selamanya.
      responses:
        "200":
          description: Dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembelian/{id}/sisa:
    get:
      tags: [pembelian]
      summary: Baris yang belum lengkap diterima
      operationId: sisaPembelian
      description: >
        Hanya baris yang `qty_diterima_dasar` kurang dari `qty_dasar`. Baris yang
        datang lengkap tidak muncul — ini daftar kerja untuk mengejar susulan lewat
        WhatsApp, dan baris yang lengkap tidak ada di dalamnya.


        Isu #12 fase 6: penyaringan yang sama dengan `GET /pembelian/{id}` —
        dokumen di luar unit_kerja aktif menjawab 404.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SisaPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/penerimaan-susulan:
    get:
      tags: [penerimaan-susulan]
      summary: List penerimaan susulan
      operationId: listPenerimaanSusulan
      description: >
        Tidak menyertakan `detail`; kuncinya hilang sama sekali, bukan array kosong.
        `search` mencocokkan nomor dokumen ini maupun nomor pembelian asalnya.


        Isu #12 fase 6: dokumen yang ruang pembelian asalnya di luar unit_kerja
        aktif sesi pemanggil dilewati begitu saja, tanpa error.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
