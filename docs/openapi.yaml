      description: >
        `POSTED` → `BATAL`. Menambah satu baris `kartu_stok` pembalik untuk setiap
        pergerakan yang dibuat dokumen ini: barangnya kembali masuk, dinilai persis
        sebesar yang tercatat saat ia keluar — satu-satunya angka yang membuat
        pasangannya berjumlah nol.


        Seperti setiap pembalikan di sistem ini, barisnya bertanggal hari ini. Retur
        yang periodenya sudah ditutup tetap bisa dibatalkan — pembaliknya masuk periode
        berjalan — dan yang bisa menghalangi justru periode **berjalan** yang sedang
        `TUTUP`.


        **Membatalkan pembelian yang punya retur POSTED ditolak 409** — batalkan
        returnya lebih dulu. Pembatalan pembelian membalik seluruh kuantitas yang
        diterima, sementara returnya sudah mengeluarkan sebagiannya, jadi pembalikannya
        akan menekan saldo di bawah nol; dan kalaupun saldonya cukup, returnya akan
        tertinggal menunjuk pembelian `BATAL` yang pembalikannya sudah memperhitungkan
        barang yang sama — kekurangan yang sama dihitung dua kali.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan_batal]
              properties:
                alasan_batal: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/mutasi:
    get:
      tags: [mutasi]
      summary: List mutasi antar ruang
      operationId: listMutasi
      description: >
        Tidak menyertakan `detail`; kuncinya hilang sama sekali, bukan array kosong.
        `search` mencocokkan nomor dokumen maupun keterangannya.


        `status=DRAFT` dengan `terlama_dulu=true` adalah **antrean kerja
        `SUPERADMIN`**. Karena mutasi tidak punya `DIAJUKAN`, tidak ada sinyal lain
        bahwa sebuah draft sudah siap diposting, dan daftar inilah penggantinya —
        diurutkan paling lama dulu, seperti `GET /supplier/{id}/utang`, karena antrean
        dibaca untuk dikerjakan, bukan untuk melihat yang terbaru.


        Isu #12 fase 6: dokumen yang `id_ruang_asal`-nya di luar unit_kerja
        aktif sesi pemanggil dilewati begitu saja, tanpa error —
        `id_ruang_tujuan` tidak pernah diperiksa, mengikuti aturan yang sama
        dengan validasi tulis di fase 5.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, POSTED, BATAL] }
        - name: id_ruang_asal
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: id_ruang_tujuan
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: tanggal_dari
          in: query
          schema: { type: string, format: date }
        - name: tanggal_sampai
          in: query
          schema: { type: string, format: date }
        - name: terlama_dulu
          in: query
          description: Urutkan paling lama dulu, untuk dibaca sebagai antrean.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Mutasi" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [mutasi]
      summary: Buat draft mutasi
      operationId: createMutasi
      description: >
        Nomor diambil dari `document_counter` dengan prefix `MT`, direset per bulan dan
        dikunci pada tanggal dokumennya.


        `detail` boleh kosong di sini — mutasi biasanya dibuka saat troli masih dimuat —
        tetapi posting menolak dokumen tanpa baris. Produk yang sama boleh muncul lebih
        dari sekali, tidak seperti `penerimaan-susulan` dan `retur-pembelian`: di sana
        kuotanya per baris dokumen induk, di sini kuotanya saldo ruang asal dan seluruh
        baris dijumlahkan terhadapnya.


        `id_ruang_asal` harus berbeda dari `id_ruang_tujuan` (`mutasi_ruang_check`).


        Tidak ada angka uang sama sekali di dokumen ini. Harga pokoknya baru terisi saat
        posting, dari rata-rata bergerak ruang asal yang hanya diketahui trigger
        `kartu_stok`.


        **Isu #12 fase 5:** `id_ruang_asal` divalidasi terhadap unit_kerja aktif
        sesi pemanggil, kalau tidak → 403. `id_ruang_tujuan` **tidak pernah**
        dibatasi — mutasi antar unit sengaja diperbolehkan (isu #12 fase 1); yang
        diperiksa hanya wewenang atas ruang tempat barang dinyatakan keluar.


        Role: `INVENTARIS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tanggal, id_ruang_asal, id_ruang_tujuan]
              properties:
                tanggal: { type: string, format: date }
                id_ruang_asal: { type: integer, format: int64, minimum: 1 }
                id_ruang_tujuan: { type: integer, format: int64, minimum: 1 }
                keterangan: { type: string, maxLength: 1000 }
                detail:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/MutasiDetailInput" }
      responses:
        "201":
          description: Draft dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Mutasi" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/mutasi/{id}:
    get:
      tags: [mutasi]
      summary: Detail mutasi beserta barisnya
      operationId: getMutasi
      description: >
        Isu #12 fase 6: dokumen yang `id_ruang_asal`-nya di luar unit_kerja
        aktif sesi pemanggil menjawab 404, sama seperti id yang tidak ada.
        `id_ruang_tujuan` tidak pernah diperiksa — dokumen yang tujuannya di
        unit lain tetap terlihat selama `id_ruang_asal`-nya cocok.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Mutasi" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

    patch:
      tags: [mutasi]
      summary: Ubah header mutasi
      operationId: updateMutasi
      description: >
        **Hanya saat `DRAFT`.** Kedua ruang boleh diubah, berbeda dengan
        `pembayaran-utang` yang mengeluarkan `id_supplier` dari DTO update-nya: di sana
        alokasi menunjuk faktur supplier tertentu, sedangkan di sini tidak ada baris
        detail yang menunjuk ruang — ruangnya hanya ada di header, jadi tidak ada yang
        tertinggal salah.


        Ruang asal dan tujuan tetap tidak boleh sama, dan itu diperiksa terhadap baris
        yang tersimpan: mengubah salah satunya saja bisa bertabrakan dengan yang sudah
        ada di sana.


        **Isu #12 fase 5:** kalau `id_ruang_asal` dikirim, nilai barunya divalidasi
        terhadap unit_kerja aktif sesi pemanggil, kalau tidak → 403. Tidak dikirim
        berarti tidak diperiksa ulang — ruang tersimpan sudah pasti valid, karena
        `ruang` sendiri tidak punya `PATCH` sehingga unitnya tidak bisa berubah.
        `id_ruang_tujuan` tidak pernah dibatasi, alasannya sama seperti di `POST`.


        Role: `INVENTARIS`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggal: { type: string, format: date }
                id_ruang_asal: { type: integer, format: int64, minimum: 1 }
                id_ruang_tujuan: { type: integer, format: int64, minimum: 1 }
                keterangan: { type: string, maxLength: 1000, nullable: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Mutasi" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/mutasi/{id}/detail:
    put:
      tags: [mutasi]
      summary: Ganti seluruh baris mutasi
      operationId: replaceMutasiDetail
      description: >
        **Hanya saat `DRAFT`.** Barisnya diganti sekaligus, bukan satu per satu: baris
        satu mutasi adalah satu hal yang dihitung dan dimuat bersama, dan penyuntingan
        sebagian meninggalkan dokumen yang tidak konsisten dengan dirinya sendiri di
        antara dua request.


        Berbeda dengan `POST /api/v1/mutasi`, di sini `detail` wajib berisi minimal satu
        baris — mengosongkan dokumen lewat jalur yang berarti "inilah barisnya" adalah
        permintaan yang lebih baik ditolak.


        Role: `INVENTARIS`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detail]
              properties:
                detail:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/MutasiDetailInput" }
      responses:
        "200":
          description: Baris diganti
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Mutasi" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/mutasi/{id}/posting:
    post:
      tags: [mutasi]
      summary: Posting mutasi ke kartu stok
      operationId: postingMutasi
      description: >
        `DRAFT` → `POSTED`, langsung tanpa `DIAJUKAN`. Menulis **dua** baris
        `kartu_stok` per baris detail: `MUTASI_KELUAR` di ruang asal lalu `MUTASI_MASUK`
        di ruang tujuan, dalam satu transaksi.


        Urutan kedua insert itu terpaksa, dan keterpaksaannya yang membuat modul ini
        benar. Nilai yang masuk ke ruang tujuan adalah **persis** `nilai_keluar` yang
        dikembalikan baris keluar — bukan angka yang dihitung ulang, bukan pula harga
        pokok yang diketik saat draft. Rata-rata bergerak ruang asal hanya diketahui
        trigger, yang membacanya di dalam advisory lock, dan trigger juga menimpa
        `nilai_keluar` pada setiap baris keluar. Hasilnya: Σ `nilai_akhir` seluruh ruang
        tidak bergerak sedikit pun.


        `mutasi_detail.harga_pokok_satuan_dasar` ikut terisi di sini, dari
        `harga_pokok_satuan` yang dilaporkan baris keluar.


        Saldo ruang asal yang tidak mencukupi ditolak 400 dengan pesan yang menyebut
        produk dan kedua angkanya; periode yang sudah `TUTUP` ditolak 400 dengan pesan
        yang menyebut bulannya. Keduanya dijaga trigger — pemeriksaan di aplikasi hanya
        untuk kalimatnya.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Diposting
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Mutasi" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/mutasi/{id}/batal:
    post:
      tags: [mutasi]
      summary: Batalkan mutasi POSTED dengan baris pembalik
      operationId: batalMutasi
      description: >
        `POSTED` → `BATAL`. Menambah baris pembalik untuk setiap pergerakan yang dibuat
        dokumen ini: barangnya masuk lagi ke ruang asal dan keluar dari ruang tujuan.


        **Pembatalannya tidak simetris nilainya, dan itu tidak bisa diperbaiki.** Baris
        yang keluar dari ruang tujuan dinilai dengan rata-rata bergerak ruang tujuan
        saat ini, yang bisa sudah bergeser karena barang lain masuk ke sana. Jadi mutasi
        dan pembatalannya selalu berjumlah nol dalam kuantitas, tetapi tidak selalu
        dalam nilai. Keterbatasan yang sama sudah tercatat untuk `pembelian`: trigger
        yang memiliki harga pokok setiap baris keluar, jadi menyalin nilai aslinya
        memang tidak tersedia.


        **Pembatalannya juga bisa ditolak 400.** Kalau barangnya sudah keluar lagi dari
        ruang tujuan, baris pembaliknya menyeret saldo ruang itu ke negatif dan trigger
        menolaknya. Itu memang benar: barang yang sudah terjual dari toko tidak bisa
        dikembalikan ke gudang lewat pembatalan — obatnya mutasi lagi.


        Barisnya bertanggal hari ini, seperti setiap pembalikan di sistem ini. Mutasi
        yang periodenya sudah ditutup tetap bisa dibatalkan — pembaliknya masuk periode
        berjalan — dan yang menghalangi justru periode **berjalan** yang sedang `TUTUP`.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan_batal]
              properties:
                alasan_batal: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Mutasi" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembayaran-utang:
    get:
      tags: [pembayaran-utang]
      summary: List pembayaran utang
      operationId: listPembayaranUtang
      description: >
        Tidak menyertakan `alokasi`; kuncinya hilang sama sekali, bukan array kosong —
        untuk dokumen ini array kosong adalah klaim yang bermakna (uang titipan yang
        belum dialokasikan), jadi menghilangkan kuncinya lebih jujur pada endpoint yang
        tidak membacanya. `search` mencocokkan nomor dokumen maupun `no_referensi`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, POSTED, BATAL] }
        - name: metode
          in: query
          schema: { type: string, enum: [TUNAI, TRANSFER, GIRO] }
        - name: status_giro
          in: query
          description: Daftar giro yang belum cair adalah pekerjaan harian keuangan.
          schema: { type: string, enum: [BELUM_CAIR, CAIR, TOLAK] }
        - name: id_supplier
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: tanggal_dari
          in: query
          schema: { type: string, format: date }
        - name: tanggal_sampai
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PembayaranUtang" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [pembayaran-utang]
      summary: Buat draft pembayaran utang
      operationId: createPembayaranUtang
      description: >
        Uang yang dibayarkan ke supplier, beserta pembagiannya ke faktur-faktur.


        **Tidak ada tahap `DIAJUKAN`**, dan itu keputusan, bukan kelalaian meniru
        pembelian. Tahap persetujuan di sana ada karena `kartu_stok` append-only:
        posting yang salah hanya bisa dibalik, dan pembalikannya dinilai pada rata-rata
        yang sudah bergeser. Alokasi pembayaran tidak begitu — ia bisa dibatalkan dan
        seluruh cache dihitung ulang persis. Kontrol dua orangnya tetap ada, satu state
        lebih sedikit: `CASHIER` menyiapkan, `SUPERADMIN` melepas uangnya.


        `alokasi` boleh kosong atau tidak dikirim sama sekali. Uang kadang dibayarkan
        sebelum diputuskan menutup faktur yang mana, dan sisanya mengendap sebagai
        titipan — aturan yang sama dengan `jumlah_dialokasikan` yang boleh lebih kecil
        dari `jumlah`.


        Dua batas diperiksa dan keduanya pertanyaan yang berbeda: total alokasi tidak
        boleh melebihi `jumlah` pembayaran, dan setiap alokasi tidak boleh melebihi sisa
        utang fakturnya. Satu request bisa lolos yang satu dan gagal yang lain.


        Fakturnya harus `POSTED` dan milik supplier yang sama. `DRAFT` adalah halaman
        yang diketik, bukan utang; `BATAL` adalah utang yang ditarik kembali.


        `metode: GIRO` mengisi `status_giro` menjadi `BELUM_CAIR` secara otomatis.
        `tanggal_jatuh_tempo_giro` hanya diterima untuk GIRO.


        Nomor digenerate server dengan seri sendiri, `PU/2026/08/0001`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_supplier, tanggal, metode, jumlah]
              properties:
                id_supplier: { type: integer, format: int64, minimum: 1 }
                tanggal: { type: string, format: date, example: "2026-08-20" }
                metode: { type: string, enum: [TUNAI, TRANSFER, GIRO] }
                no_referensi:
                  type: string
                  nullable: true
                  maxLength: 64
                  description: Nomor transfer, nomor warkat giro, atau nomor kuitansi.
                nama_bank: { type: string, nullable: true, maxLength: 128 }
                tanggal_jatuh_tempo_giro:
                  type: string
                  format: date
                  nullable: true
                  description: "Hanya untuk `metode: GIRO`; ditolak 400 pada metode lain."
                jumlah:
                  type: string
                  description: String desimal, harus lebih dari nol.
                  example: "400000"
                keterangan: { type: string, nullable: true, maxLength: 1000 }
                alokasi:
                  type: array
                  maxItems: 500
                  description: Boleh kosong. Satu faktur hanya boleh muncul sekali.
                  items: { $ref: "#/components/schemas/PembayaranUtangAlokasiInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PembayaranUtang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembayaran-utang/{id}:
    get:
      tags: [pembayaran-utang]
      summary: Detail pembayaran utang beserta alokasinya
      operationId: getPembayaranUtang
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PembayaranUtang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

    patch:
      tags: [pembayaran-utang]
      summary: Ubah header pembayaran utang
      operationId: updatePembayaranUtang
      description: >
        **Hanya saat `DRAFT`.**


        `id_supplier` tidak ada di sini: ia adalah tujuan uangnya, dan mengubahnya akan
        membuat seluruh alokasi menunjuk faktur supplier lain. `metode` juga tidak,
        karena ia yang menentukan boleh-tidaknya kolom giro terisi — ganti dengan
        membatalkan lalu menginput ulang, yang juga bentuk yang akan terlihat di rekening
        koran.


        Menurunkan `jumlah` di bawah yang sudah dialokasikan ditolak 400 dengan menyebut
        angkanya, bukan dibiarkan gagal di constraint.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggal: { type: string, format: date }
                no_referensi: { type: string, nullable: true, maxLength: 64 }
                nama_bank: { type: string, nullable: true, maxLength: 128 }
                tanggal_jatuh_tempo_giro: { type: string, format: date, nullable: true }
                jumlah: { type: string }
                keterangan: { type: string, nullable: true, maxLength: 1000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PembayaranUtang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembayaran-utang/{id}/alokasi:
    put:
      tags: [pembayaran-utang]
      summary: Ganti seluruh alokasi pembayaran
      operationId: replacePembayaranUtangAlokasi
      description: >
        `PUT`, bukan `PATCH`: alokasinya diganti sekaligus, karena pembagian satu
        pembayaran ke beberapa faktur adalah satu keputusan, dan suntingan sebagian akan
        membuat `jumlah_dialokasikan` di header berselisih dengan barisnya sendiri di
        antara dua request. **Hanya saat `DRAFT`.**


        Array kosong diterima dan berarti "jangan alokasikan apa pun" — berbeda dari baris
        detail dokumen yang tidak boleh kosong. Pembayaran tanpa alokasi adalah titipan
        yang mengendap di supplier, dan itu keadaan yang nyata.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alokasi:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/PembayaranUtangAlokasiInput" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PembayaranUtang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembayaran-utang/{id}/posting:
    post:
      tags: [pembayaran-utang]
      summary: Sahkan pembayaran dan lunasi fakturnya
      operationId: postingPembayaranUtang
      description: >
        `DRAFT` → `POSTED`. Satu transaksi memeriksa ulang setiap alokasi terhadap sisa
        utang fakturnya, menutup dokumen, lalu menghitung ulang
        `pembelian.status_pembayaran` untuk setiap faktur yang disentuhnya.


        Pemeriksaan yang menentukan terjadi di sini, di bawah row lock tiap faktur. Yang
        saat draft hanya memberi error lebih cepat: di antara draft ditulis dan diposting,
        pembayaran lain atau sebuah retur bisa lebih dulu menghabiskan sisa yang dituju.


        **Giro diposting seperti yang lain dan belum melunasi apa pun.** Dokumennya jadi
        nyata, alokasinya jadi nyata, seluruh cache dihitung ulang — dan untuk giro
        `BELUM_CAIR` hasilnya membiarkan utangnya tepat di tempatnya. Itu memang
        maksudnya: kertasnya sudah berpindah tangan, uangnya belum.


        Ditolak 400 kalau ada alokasi yang melebihi sisa utang fakturnya, kalau fakturnya
        bukan `POSTED`, atau kalau fakturnya milik supplier lain.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PembayaranUtang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembayaran-utang/{id}/batal:
    post:
      tags: [pembayaran-utang]
      summary: Batalkan pembayaran yang sudah diposting
      operationId: batalPembayaranUtang
      description: >
        `POSTED` → `BATAL`. Setiap faktur yang ditutupnya kembali berutang seperti
        sebelumnya.


        Tidak ada dokumen pembalik dan tidak ada yang dihapus — ini satu-satunya tempat
        modul ini benar-benar lebih sederhana daripada sisi stok. `status_pembayaran`
        adalah fungsi murni dari baris-baris POSTED, jadi memindahkan dokumen ini keluar
        dari POSTED lalu menghitung ulang sudah persis. Tidak ada residu penilaian yang
        tertinggal, tidak seperti pembalikan `kartu_stok`.


        Baris alokasinya tetap ada, jadi pembatalannya bisa diaudit: apa yang diklaim
        dilunasi pembayaran ini tetap terbaca di samping `alasan_batal`.


        **Membatalkan pembelian yang punya pembayaran POSTED ditolak 409** — batalkan
        pembayarannya lebih dulu. Uangnya sudah keluar dari bank, dan ke mana seharusnya
        uang itu pergi adalah keputusan, bukan langkah aritmetika. Giro yang belum cair
        ikut memblokir: ia tidak mengurangi utang, tetapi ia kertas yang menunjuk faktur
        itu dan akan mustahil dijelaskan saat cair.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan_batal]
              properties:
                alasan_batal: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PembayaranUtang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembayaran-utang/{id}/cair:
    post:
      tags: [pembayaran-utang]
      summary: Catat giro sudah cair di bank
      operationId: cairkanGiro
      description: >
        `status_giro: BELUM_CAIR` → `CAIR`. **Ini momen utangnya benar-benar berkurang**,
        bukan saat gironya diserahkan. Sampai di sini kertasnya cuma janji, dan
        memperlakukan janji sebagai pembayaran adalah cara supplier berakhir menagih
        faktur yang menurut sistem sudah lunas.


        Sisa utang setiap faktur diperiksa lagi di sini, dan itu bukan paranoia:
        alokasinya tidak berarti apa-apa selama giro menggantung, jadi tidak ada yang
        menahan pembayaran lain melunasi faktur yang sama lebih dulu — dan giro bisa
        menggantung berminggu-minggu. Kalau itu terjadi, pencairannya ditolak 400 dan
        gironya tetap `BELUM_CAIR`.


        Butuh dokumen `POSTED` dengan `metode: GIRO` dan `status_giro: BELUM_CAIR`. Giro
        yang sudah cair atau sudah ditolak tidak bisa dicairkan lagi.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tanggal_cair]
              properties:
                tanggal_cair:
                  type: string
                  format: date
                  description: Tidak boleh sebelum tanggal pembayarannya.
                  example: "2026-09-22"
      responses:
        "200":
          description: Cair
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PembayaranUtang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pembayaran-utang/{id}/tolak-giro:
    post:
      tags: [pembayaran-utang]
      summary: Catat giro ditolak bank
      operationId: tolakGiro
      description: >
        `status_giro: BELUM_CAIR` → `TOLAK`. Tidak ada yang perlu dikembalikan dan tidak
        ada cache yang berubah, karena giro yang belum cair memang belum pernah mengurangi
        utang apa pun. Fakturnya masih terbuka penuh dan masih bisa dibayar dengan cara
        lain.


        `tanggal_cair` tetap kosong: giro yang ditolak tidak punya tanggal cair, dan
        constraint `pembayaran_utang_tanggal_cair_check` menegakkan itu.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                alasan:
                  type: string
                  maxLength: 500
                  description: Ditambahkan ke `keterangan` dokumen bila dikirim.
                  example: dana tidak cukup
      responses:
        "200":
          description: Ditolak
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PembayaranUtang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/periode:
    get:
      tags: [periode]
      summary: List periode
      description: >
        Halaman baris `periode` yang tersimpan, bulan terbaru lebih dulu.


        Perhatikan apa yang **tidak** muncul di sini: bulan yang belum pernah ditutup
        tidak punya baris sama sekali, jadi ia tidak ada di daftar ini betapapun
        terbukanya. Itu bukan kekurangan — tabelnya mencatat penutupan, bukan
        kalender. Untuk menanyakan satu bulan tertentu pakai
        `GET /api/v1/periode/{tahun}/{bulan}`, yang menjawab untuk bulan mana pun.
      operationId: listPeriode
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: tahun
          in: query
          description: Kosongkan untuk seluruh tahun.
          schema: { type: integer, minimum: 2000, maximum: 9999 }
        - name: status
          in: query
          description: Kosongkan untuk kedua status.
          schema: { type: string, enum: [BUKA, TUTUP] }
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Periode" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/periode/{tahun}/{bulan}:
    get:
      tags: [periode]
      summary: Status tutup buku satu bulan
      description: >
        Menjawab untuk bulan mana pun, ada barisnya atau tidak.


        Bulan yang belum pernah ditutup menjawab **`BUKA` sintetis**, bukan 404: baris
        `periode` yang tidak ada memang berarti bulannya terbuka — itu keputusan
        migrasi `000004`, supaya database baru tidak macet sebelum ada data. Menjawab
        404 akan mengundang klien menyimpulkan bulannya tidak ada.


        Responsnya tidak memuat `id`. Identitas sebuah periode adalah pasangan
        `(tahun, bulan)`, dan dengan begitu bulan yang belum pernah ditutup punya
        bentuk respons yang sama persis dengan yang sudah.
      operationId: getPeriode
      parameters:
        - $ref: "#/components/parameters/Tahun"
        - $ref: "#/components/parameters/Bulan"
      responses:
        "200":
          description: Status bulan itu
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Periode" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/periode/{tahun}/{bulan}/tutup:
    post:
      tags: [periode]
      summary: Tutup buku satu bulan
      description: >
        Menutup buku bulan itu: sejak commit, setiap dokumen yang menulis `kartu_stok`
        dengan `tanggal_transaksi` di dalamnya ditolak. Penegakannya di trigger, jadi
        modul yang belum ditulis pun mewarisinya tanpa satu baris kode.


        Tidak ada body. Yang ditanyakan seluruhnya ada di path, dan pelakunya diambil
        dari token — `ditutup_oleh` tidak pernah datang dari request.


        Bulan yang belum punya baris akan **dibuatkan** barisnya, bukan diubah.
        Jejak pembukaan sebelumnya (`dibuka_oleh`, `ts_buka`) sengaja tidak dihapus:
        itu satu-satunya catatan bahwa bulan ini pernah dibuka kembali.


        Menutup **tidak harus berurutan** — Agustus boleh ditutup selagi Juli masih
        terbuka. Menuntut urutan berarti memaksa menutup bulan-bulan yang tidak pernah
        dipakai lebih dulu, dan tidak ada yang bisa rusak karena selanya.
      operationId: tutupPeriode
      parameters:
        - $ref: "#/components/parameters/Tahun"
        - $ref: "#/components/parameters/Bulan"
      responses:
        "200":
          description: Bulan itu sekarang TUTUP
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Periode" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        # Bulan itu memang sudah TUTUP.
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/periode/{tahun}/{bulan}/buka:
    post:
      tags: [periode]
      summary: Buka kembali bulan yang sudah ditutup
      description: >
        Kebalikan dari `tutup`, dan `SUPERADMIN` juga — bulan yang bisa dibuka siapa
        saja tidak pernah benar-benar tertutup. Mengisi `dibuka_oleh` dan `ts_buka`
        tanpa menyentuh `ditutup_oleh`/`ts_tutup`, sehingga riwayat penutupan yang
        dibatalkan tetap terbaca.


        Bulan yang tidak sedang `TUTUP` ditolak **409**, termasuk bulan yang tidak
        punya baris sama sekali. Keduanya sudah terbuka, dan menjawab 200 untuk
        "bukalah ini" akan membuat pemanggil mengira ada yang berubah.


        Tidak ada `DELETE`. Bulan yang keliru ditutup dibuka kembali, tidak dihapus.
      operationId: bukaPeriode
      parameters:
        - $ref: "#/components/parameters/Tahun"
        - $ref: "#/components/parameters/Bulan"
      responses:
        "200":
          description: Bulan itu sekarang BUKA
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Periode" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        # Bulan itu tidak sedang TUTUP, termasuk kalau barisnya belum pernah ada.
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/unit-kerja:
    get:
      tags: [unit-kerja]
      summary: List unit kerja
      operationId: listUnitKerja
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          description: >
            Cocokkan sebagian pada kode atau nama unit. `%` dan `_` diperlakukan
            sebagai teks biasa, bukan wildcard.
          schema: { type: string, maxLength: 255 }
        - $ref: "#/components/parameters/IsAktif"
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnitKerja" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [unit-kerja]
      summary: Create unit kerja
      operationId: createUnitKerja
      description: >
        Isu #12 fase 2: lokasi organisasi yang jadi induk setiap `ruang`.
        `user_role.id_unit_kerja` dan konteks aktif sesi belum ada — lihat
        catatan "Unit kerja and location-bound authority" di CLAUDE.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama]
              properties:
                kode:
                  type: string
                  maxLength: 32
                  nullable: true
                  description: >
                    Opsional. Unik tanpa memperhatikan huruf besar-kecil, tapi
                    beberapa unit boleh sama-sama tidak punya kode.
                  example: "PUSAT"
                nama: { type: string, maxLength: 255, example: "Unit Utama" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UnitKerja" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/unit-kerja/{id}:
    get:
      tags: [unit-kerja]
      summary: Get unit kerja by id
      operationId: getUnitKerja
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UnitKerja" }
        "404": { $ref: "#/components/responses/Error" }

    patch:
      tags: [unit-kerja]
      summary: Update unit kerja
      operationId: updateUnitKerja
      description: >
        Field yang tidak dikirim tidak diubah. Mengirim `null` pada kode
        mengosongkan kolom itu. `id`, `created_at`, dan `created_by` tidak
        pernah diambil dari body.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                kode: { type: string, maxLength: 32, nullable: true }
                nama: { type: string, maxLength: 255 }
                is_aktif: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UnitKerja" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/ruang:
    get:
      tags: [ruang]
      summary: List ruang
      operationId: listRuang
      description: >
        Isu #12 fase 6: ruang di luar unit_kerja aktif sesi pemanggil
        dilewati begitu saja, tanpa error. Konteks aktif global melihat
        semua ruang seperti biasa.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          description: >
            Cocokkan sebagian pada kode atau nama ruang. `%` dan `_` diperlakukan
            sebagai teks biasa, bukan wildcard.
          schema: { type: string, maxLength: 255 }
        - $ref: "#/components/parameters/IsAktif"
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Ruang" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [ruang]
      summary: Create ruang
      operationId: createRuang
      description: >
        `id_unit_kerja` wajib dan divalidasi menunjuk unit kerja yang aktif
        (isu #12 fase 2) — ruang tanpa unit adalah ruang yang tidak bisa
        diputuskan siapa berhak memakainya. `ruang` masih tidak punya PATCH,
        jadi unitnya tidak bisa diganti lewat API ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama_ruang, id_unit_kerja]
              properties:
                kode:
                  type: string
                  maxLength: 32
                  nullable: true
                  description: >
                    Opsional. Unik tanpa memperhatikan huruf besar-kecil, tapi
                    beberapa ruang boleh sama-sama tidak punya kode.
                  example: "GD-UTM"
                nama_ruang: { type: string, maxLength: 255, example: "Gudang Utama" }
                id_unit_kerja:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Harus menunjuk unit_kerja yang masih is_aktif.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Ruang" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/ruang/{id}:
    get:
      tags: [ruang]
      summary: Get ruang by id
      operationId: getRuang
      description: >
        Isu #12 fase 6: ruang di luar unit_kerja aktif sesi pemanggil
        menjawab 404, sama seperti id yang tidak ada.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Ruang" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/satuan:
    get:
      tags: [satuan]
      summary: List satuan
      operationId: listSatuan
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
