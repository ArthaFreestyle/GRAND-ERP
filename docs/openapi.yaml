        Nomor digenerate server dengan seri sendiri, `RB/2026/08/0001`.


        Setiap baris tidak boleh melebihi yang bisa diretur
        (`qty_diterima_dasar + Σ susulan POSTED − Σ retur POSTED`). Perhatikan
        kuantitas yang **tidak** ikut: `qty_dasar`. Yang difakturkan adalah yang
