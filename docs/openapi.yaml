      operationId: postingPenerimaanSusulan
      description: >
        `DIAJUKAN` → `POSTED`. Satu transaksi menulis satu baris `kartu_stok` per
        baris dokumen dengan `jenis_transaksi = PENERIMAAN_SUSULAN`, lalu menghitung
        ulang `pembelian.status_penerimaan`.


        Nilai yang masuk disalin dari `pembelian_detail.harga_pokok_satuan_dasar`,
        bukan dihitung ulang dan bukan dibaca dari rata-rata terkini: harga barang
        sudah ditetapkan faktur, dan kiriman keduanya tidak mengubahnya. Karena itu
        pembelian dan seluruh susulannya berjumlah **persis** nilai faktur.


        Sisa per baris diperiksa lagi di sini, di bawah row lock pembelian — dan itu
        pemeriksaan yang menentukan. Di antara draft ditulis dan diposting, susulan
        lain untuk pembelian yang sama bisa lebih dulu menghabiskan sisanya.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PenerimaanSusulan" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/penerimaan-susulan/{id}/batal:
    post:
      tags: [penerimaan-susulan]
      summary: Batalkan dokumen POSTED dengan baris pembalik
      operationId: batalPenerimaanSusulan
      description: >
        `POSTED` → `BATAL`. Menambah satu baris `kartu_stok` pembalik untuk setiap
        pergerakan yang dibuat dokumen ini, lalu mengembalikan sisanya ke pembelian
        dengan menghitung ulang `status_penerimaan`.


        Berlaku catatan yang sama seperti pembatalan pembelian: baris pembalik
        dinilai pada rata-rata bergerak yang berlaku sekarang, bukan pada harga pokok
        baris aslinya, karena trigger menimpa harga pokok setiap baris keluar.


        **Membatalkan pembelian yang punya susulan POSTED ditolak 409** — batalkan
        susulannya lebih dulu. Pembatalan pembelian hanya membalik baris yang ditulis
        pembelian itu sendiri, jadi stok susulannya akan tertinggal tanpa dokumen yang
        menjelaskannya, dan setelah itu tidak bisa dibalik lagi karena jalur
        pembatalannya menuntut pembelian yang masih POSTED.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan_batal]
              properties:
                alasan_batal: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PenerimaanSusulan" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/retur-pembelian:
    get:
      tags: [retur-pembelian]
      summary: List retur pembelian
      operationId: listReturPembelian
      description: >
        Tidak menyertakan `detail`; kuncinya hilang sama sekali, bukan array kosong.
        `search` mencocokkan nomor dokumen ini maupun nomor pembelian asalnya.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        - name: id_pembelian
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: id_supplier
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: tanggal_dari
          in: query
          schema: { type: string, format: date }
        - name: tanggal_sampai
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Halaman hasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReturPembelian" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }

    post:
      tags: [retur-pembelian]
      summary: Buat draft retur pembelian
      operationId: createReturPembelian
      description: >
        Barang yang dikembalikan ke supplier. Cermin dari penerimaan susulan:
        sama-sama menunjuk baris `pembelian_detail` dan sama-sama menyalin harga
        pokoknya dari sana, arah barangnya saja yang berlawanan.


        **Pembelian asalnya harus `POSTED`.** Sebelum itu barisnya belum punya
        `harga_pokok_satuan_dasar` untuk disalin, dan belum ada barang yang datang
        untuk dikirim balik.


        `id_supplier` dan `id_ruang` tidak ada di body: keduanya disalin dari
        pembelian. Suppliernya adalah yang menjual barangnya, dan ruangnya adalah
        tempat pembelian itu menaruhnya — barang yang perlu dikembalikan dari ruang
        lain adalah pekerjaan mutasi lebih dulu.


        Nomor digenerate server dengan seri sendiri, `RB/2026/08/0001`.


        Setiap baris tidak boleh melebihi yang bisa diretur
        (`qty_diterima_dasar + Σ susulan POSTED − Σ retur POSTED`). Perhatikan
        kuantitas yang **tidak** ikut: `qty_dasar`. Yang difakturkan adalah yang
        ditagih supplier, dan barang yang tidak pernah datang tidak bisa dikirim
        balik — kekurangan kiriman dikejar dengan penerimaan susulan, bukan retur.


        Pengecekan yang menentukan terjadi saat posting, di bawah row lock pembelian;
        yang di sini hanya memberi error lebih cepat.


        `alasan` wajib meski kolomnya nullable. Ia satu-satunya catatan kenapa barang
        yang sudah dibayar dikirim balik, dan itu yang dibacakan ke supplier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_pembelian, tanggal, alasan, detail]
              properties:
                id_pembelian: { type: integer, format: int64, minimum: 1 }
                tanggal: { type: string, format: date, example: "2026-08-15" }
                alasan: { type: string, maxLength: 1000, example: barang rusak saat diterima }
                detail:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/ReturPembelianDetailInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/retur-pembelian/{id}:
    get:
      tags: [retur-pembelian]
      summary: Detail retur pembelian beserta barisnya
      operationId: getReturPembelian
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }

    patch:
      tags: [retur-pembelian]
      summary: Ubah header retur pembelian
      operationId: updateReturPembelian
      description: >
        **Hanya saat `DRAFT`.** Hanya dua field yang benar-benar milik operator yang
        bisa diubah; `id_pembelian`, `id_supplier`, dan `id_ruang` menentukan dokumen
        ini retur atas apa dan tidak ada di sini.


        `alasan: null` ditolak 400 walaupun kolomnya nullable: jalur create menuntut
        alasan, jadi membiarkan patch mengosongkannya akan menghasilkan dokumen yang
        tidak mungkin dibuat lewat create.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggal: { type: string, format: date }
                alasan: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/retur-pembelian/{id}/detail:
    put:
      tags: [retur-pembelian]
      summary: Ganti seluruh baris retur pembelian
      operationId: replaceReturPembelianDetail
      description: >
        `PUT`, bukan `PATCH`: barisnya diganti sekaligus, karena baris satu kiriman
        balik adalah satu kesatuan yang dikemas dan dihitung bersamaan.
        **Hanya saat `DRAFT`.**
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detail]
              properties:
                detail:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/ReturPembelianDetailInput" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/retur-pembelian/{id}/ajukan:
    post:
      tags: [retur-pembelian]
      summary: Ajukan draft untuk disetujui
      operationId: ajukanReturPembelian
      description: >
        `DRAFT` → `DIAJUKAN`. Tanpa body. Dokumen tanpa baris ditolak 400.
        Role: `INVENTARIS` atau `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Diajukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/retur-pembelian/{id}/tolak:
    post:
      tags: [retur-pembelian]
      summary: Tolak pengajuan, kembalikan ke DRAFT
      operationId: tolakReturPembelian
      description: "`DIAJUKAN` → `DRAFT`, `alasan` wajib. Role: `SUPERADMIN`."
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Ditolak
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/retur-pembelian/{id}/posting:
    post:
      tags: [retur-pembelian]
      summary: Setujui dan keluarkan dari kartu stok
      operationId: postingReturPembelian
      description: >
        `DIAJUKAN` → `POSTED`. Satu transaksi menulis satu baris `kartu_stok` per baris
        dokumen dengan `jenis_transaksi = RETUR_PEMBELIAN` dan `stok_keluar` terisi.


        **`total` dokumen ini dan nilai yang dicatat kartu stok tidak selalu sama, dan
        itu bukan bug.** `total` adalah nilai barang menurut faktur, dihitung dari
        harga pokok yang disalin dari baris pembelian — itu yang membuat pembelian dan
        returnya saling menghapus. Sementara `kartu_stok` menilai setiap baris keluar
        pada rata-rata bergerak yang berlaku saat itu, karena barangnya sudah tercampur
        dengan stok lama sejak ia datang dan tidak ada lagi batch yang bisa dipisahkan.


        `pembelian.status_penerimaan` sengaja **tidak** dihitung ulang: mengirim barang
        balik tidak membuat kiriman jadi tidak lengkap, dan tidak membuat supplier
        berutang barang lagi.


        Yang bisa diretur diperiksa lagi di sini, di bawah row lock pembelian — dan itu
        pemeriksaan yang menentukan. Di antara draft ditulis dan diposting, retur lain
        untuk pembelian yang sama bisa lebih dulu menghabiskannya.


        Ditolak 400 kalau kuantitasnya melebihi yang bisa diretur, kalau saldo stok di
        ruang itu tidak mencukupi, atau kalau periode dokumen berstatus `TUTUP`. Bulan
        tanpa baris `periode` dihitung terbuka.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/retur-pembelian/{id}/batal:
    post:
      tags: [retur-pembelian]
      summary: Batalkan dokumen POSTED dengan baris pembalik
      operationId: batalReturPembelian
      description: >
        `POSTED` → `BATAL`. Menambah satu baris `kartu_stok` pembalik untuk setiap
        pergerakan yang dibuat dokumen ini: barangnya kembali masuk, dinilai persis
        sebesar yang tercatat saat ia keluar — satu-satunya angka yang membuat
        pasangannya berjumlah nol.


        **Membatalkan pembelian yang punya retur POSTED ditolak 409** — batalkan
        returnya lebih dulu. Pembatalan pembelian membalik seluruh kuantitas yang
        diterima, sementara returnya sudah mengeluarkan sebagiannya, jadi pembalikannya
        akan menekan saldo di bawah nol; dan kalaupun saldonya cukup, returnya akan
        tertinggal menunjuk pembelian `BATAL` yang pembalikannya sudah memperhitungkan
        barang yang sama — kekurangan yang sama dihitung dua kali.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan_batal]
              properties:
                alasan_batal: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReturPembelian" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

