    post:
      tags: [penerimaan-susulan]
      summary: Setujui dan tulis ke kartu stok
      operationId: postingPenerimaanSusulan
      description: >
        `DIAJUKAN` → `POSTED`. Satu transaksi menulis satu baris `kartu_stok` per
        baris dokumen dengan `jenis_transaksi = PENERIMAAN_SUSULAN`, lalu menghitung
        ulang `pembelian.status_penerimaan`.


        Nilai yang masuk disalin dari `pembelian_detail.harga_pokok_satuan_dasar`,
        bukan dihitung ulang dan bukan dibaca dari rata-rata terkini: harga barang
        sudah ditetapkan faktur, dan kiriman keduanya tidak mengubahnya. Karena itu
        pembelian dan seluruh susulannya berjumlah **persis** nilai faktur.


        Sisa per baris diperiksa lagi di sini, di bawah row lock pembelian — dan itu
        pemeriksaan yang menentukan. Di antara draft ditulis dan diposting, susulan
        lain untuk pembelian yang sama bisa lebih dulu menghabiskan sisanya.


        Ditolak 400 kalau periode dokumen berstatus `TUTUP`; pesannya menyebut bulannya.
        Bulan tanpa baris `periode` dihitung terbuka.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
