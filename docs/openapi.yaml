  /api/v1/supplier/{id}/utang:
    get:
      tags: [supplier]
      summary: Faktur supplier yang masih terbuka
      operationId: listUtangSupplier
      description: >
        Daftar kerja untuk menyusun pembayaran: faktur mana milik supplier ini yang masih
        punya sisa, dan berapa.


        Query, bukan modul — tidak ada tabel dan tidak ada migrasi di belakangnya. Seluruh
        jawabannya turunan dari dokumen yang memang sudah diposting: total fakturnya,
        pembayaran yang efektif atasnya, dan kredit yang dihasilkan returnya.


        **Diurutkan dari yang paling lama**, berbeda dari setiap list lain di API ini. Ini
        antrean yang harus dikerjakan, dan faktur yang paling lama menunggu adalah yang
        berikutnya dibayar.


        Supplier yang tidak dikenal menjawab 404; supplier tanpa utang menjawab halaman
        kosong. Dua fakta yang berbeda.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: termasuk_lunas
          in: query
          schema: { type: boolean, default: false }
          description: >
            Ikut membawa faktur yang sudah tidak punya sisa. Mati secara default, karena
            gunanya daftar ini justru yang masih terbuka.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UtangSupplier" }
                  paging: { $ref: "#/components/schemas/PageMetadata" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/role:
    get:
