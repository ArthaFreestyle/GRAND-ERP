    post:
      tags: [penerimaan-susulan]
      summary: Batalkan dokumen POSTED dengan baris pembalik
      operationId: batalPenerimaanSusulan
      description: >
        `POSTED` → `BATAL`. Menambah satu baris `kartu_stok` pembalik untuk setiap
        pergerakan yang dibuat dokumen ini, lalu mengembalikan sisanya ke pembelian
        dengan menghitung ulang `status_penerimaan`.


        Berlaku dua catatan yang sama seperti pembatalan pembelian. Baris pembalik
        dinilai pada rata-rata bergerak yang berlaku sekarang, bukan pada harga pokok
        baris aslinya, karena trigger menimpa harga pokok setiap baris keluar. Dan
        bertanggal hari ini, jadi dokumen yang periodenya sudah ditutup tetap bisa
        dibatalkan — koreksinya masuk periode berjalan. Yang bisa menghalangi justru
        periode **berjalan** yang sedang `TUTUP`.


        **Membatalkan pembelian yang punya susulan POSTED ditolak 409** — batalkan
        susulannya lebih dulu. Pembatalan pembelian hanya membalik baris yang ditulis
        pembelian itu sendiri, jadi stok susulannya akan tertinggal tanpa dokumen yang
        menjelaskannya, dan setelah itu tidak bisa dibalik lagi karena jalur
        pembatalannya menuntut pembelian yang masih POSTED.


        Role: `SUPERADMIN`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan_batal]
              properties:
