        "409": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token dari `POST /api/v1/auth/login`, dikirim sebagai
        `Authorization: Bearer <token>`.


        Token bersifat stateless dan **tidak bisa dicabut**. Menonaktifkan user atau
        mencabut rolenya tidak mempengaruhi token yang sudah keluar; aksesnya baru
        hilang saat token kedaluwarsa, sesuai `jwt.ttl_minutes` (default 60 menit).

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

    IDHarga:
      name: id_harga
      in: path
      required: true
      description: Id baris `product_harga_jual`, bukan id product — lihat `{id}` di path yang sama.
      schema: { type: integer, format: int64 }

    # periode dikunci (tahun, bulan) dan bukan id, menyimpang dari pola /{id} di modul
    # lain dengan sengaja: pasangan itulah identitas sebenarnya sebuah periode, seperti
    # yang sudah dinyatakan periode_tahun_bulan_uidx. Rute ber-id malah tidak bisa
    # menyebut kasus yang paling sering terjadi — bulan yang belum pernah ditutup tidak
    # punya baris, jadi tidak punya id.
    Tahun:
      name: tahun
      in: path
      required: true
      schema: { type: integer, minimum: 2000, maximum: 9999 }

    Bulan:
      name: bulan
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 12 }

    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }

    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    IsAktif:
      name: is_aktif
      in: query
      description: Kosongkan untuk menampilkan baris aktif maupun tidak aktif.
      schema: { type: boolean }

  schemas:
    Dokumen:
      type: object
      description: >
        Metadata satu lampiran. Isinya diambil lewat `GET /api/v1/dokumen/{id}`, tidak
        pernah disisipkan di sini.


        `path_simpan` sengaja tidak ada di respons: itu letak berkasnya di disk server,
        dan klien tidak mendapat apa pun darinya yang tidak sudah didapat dari endpoint
        unduhan.
      properties:
        id: { type: integer, format: int64 }
        nama_asli:
          type: string
          description: >
            Nama dari klien, disimpan apa adanya **hanya untuk ditampilkan**. Tidak
            pernah dipakai sebagai path.
          example: faktur-sumber-jaya.jpg
        mime:
          type: string
          description: Hasil deteksi isi berkas, bukan header dari klien.
          enum: [image/jpeg, image/png, application/pdf]
        ukuran_byte:
          type: integer
          format: int64
          description: Yang benar-benar terhitung saat ditulis, bukan yang diklaim klien.
        checksum_sha256: { type: string, nullable: true, minLength: 64, maxLength: 64 }
        ref_table:
          type: string
          nullable: true
          description: Null selama masih yatim. Terisi bersamaan dengan `ref_id`.
          enum: [pembelian, penerimaan_susulan, retur_pembelian, pembayaran_utang]
        ref_id: { type: integer, format: int64, nullable: true }
        created_by: { type: integer, format: int64 }
        nama_pembuat: { type: string, nullable: true }
        created_at:
          type: string
          format: date-time
          description: Dasar penentuan umur berkas yatim.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Terisi berarti berkasnya sudah tidak ada di disk — dihapus operator atau
            disapu worker. Barisnya sengaja dipertahankan sebagai jejak.
        duplikat_dari_id:
          type: integer
          format: int64
          nullable: true
          description: >
            Hanya muncul pada respons unggah, dan hanya kalau sudah ada lampiran hidup
            dengan checksum yang sama. Peringatan, bukan penolakan.

    Periode:
      type: object
      description: >
        Status tutup buku satu bulan.


        Tidak ada `id`, dan itu disengaja: identitas sebuah periode adalah pasangan
        `(tahun, bulan)`. Menghilangkan kunci penggantinya membuat bulan yang belum
        pernah ditutup — yang memang tidak punya baris — bisa dijawab dengan bentuk
        yang sama persis, tanpa id null atau nol karangan.
      properties:
        tahun: { type: integer, example: 2026 }
        bulan: { type: integer, minimum: 1, maximum: 12, example: 7 }
        status:
          type: string
          enum: [BUKA, TUTUP]
          description: >
            `TUTUP` menolak setiap penulisan `kartu_stok` bertanggal di bulan ini.
            Bulan tanpa baris menjawab `BUKA`.
        ditutup_oleh: { type: integer, format: int64, nullable: true }
        nama_penutup: { type: string, nullable: true }
        ts_tutup:
          type: string
          format: date-time
          nullable: true
          description: Penutupan **terakhir**, bukan yang pertama.
        dibuka_oleh: { type: integer, format: int64, nullable: true }
        nama_pembuka: { type: string, nullable: true }
        ts_buka:
          type: string
          format: date-time
          nullable: true
          description: >
            Terisi berarti bulan ini pernah dibuka kembali setelah ditutup. Muncul
            bersama `ts_tutup` berarti ditutup, dibuka, lalu ditutup lagi.

    Ruang:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode: { type: string, nullable: true }
        nama_ruang: { type: string }
        is_aktif: { type: boolean }
        id_unit_kerja: { type: integer, format: int64 }
        nama_unit_kerja:
          type: string
          description: Diambil sekalian lewat JOIN ke unit_kerja, bukan query terpisah.

    UnitKerja:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode: { type: string, nullable: true }
        nama: { type: string }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        nama_pembuat:
          type: string
          nullable: true
          description: >
            Diambil sekalian lewat LEFT JOIN ke users, bukan query terpisah per
            baris. Null selama pembuatnya tidak diisi.
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    Satuan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nama: { type: string }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    Ekspedisi:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nama: { type: string }
        telepon: { type: string, nullable: true }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    Supplier:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode: { type: string, nullable: true }
        nama: { type: string }
        telepon: { type: string, nullable: true }
        alamat: { type: string, nullable: true }
        npwp: { type: string, nullable: true }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        nama_pembuat:
          type: string
          nullable: true
          description: >
            Diambil sekalian lewat LEFT JOIN ke users, bukan query terpisah per
            baris. Null selama modul autentikasi belum ada.
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    Pelanggan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode: { type: string, nullable: true }
        nama: { type: string }
        telepon: { type: string, nullable: true }
        alamat: { type: string, nullable: true }
        npwp: { type: string, nullable: true }
        plafon_kredit: { $ref: "#/components/schemas/PlafonKredit" }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        nama_pembuat:
          type: string
          nullable: true
          description: Diambil lewat LEFT JOIN ke users, bukan query per baris.
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    PlafonKredit:
      type: string
      nullable: true
      maxLength: 21
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: >
        Batas kredit sebagai string desimal, bukan angka floating point, supaya
        nilai yang disimpan PostgreSQL sampai ke klien tanpa pembulatan biner.


        `null` berarti **tanpa batas**, bukan nol. Nilai negatif ditolak 400.
      example: "15000000.00"

    Grant:
      type: object
      description: >
        Satu grant yang dipegang user saat token dibuat — bentuk yang mengisi
        menu penukar konteks (isu #12 fase 4). Cuma yang usable yang muncul di
        sini: role-nya `is_aktif`, dan kalau grant-nya menyebut unit, unit itu
        juga `is_aktif`. Sama seperti `roles` pada `User`, role yang sama boleh
        muncul lebih dari sekali — satu baris per unit tempat ia diberikan.
      properties:
        id_user_role:
          type: integer
          format: int64
          description: Id baris user_role — inilah yang dikirim ke switch-context.
        id_role: { type: integer, format: int64 }
        role: { type: string, example: CASHIER }
        id_unit_kerja:
          type: integer
          format: int64
          nullable: true
          description: 'null berarti grant ini berlaku di seluruh unit.'
        nama_unit_kerja:
          type: string
          nullable: true

    ActiveContext:
      type: object
      nullable: true
      description: >
        Grant yang sedang dipakai sesi ini — isu #12 fase 4. `null` berarti
        pemanggil belum memilih: itu terjadi saat login dengan lebih dari satu
        grant usable, dan sesi seperti itu tidak mengotorisasi apa pun sampai
        `POST /auth/switch-context` dipanggil — `role tidak mencukupi` akan
        menjawab setiap endpoint yang butuh role, termasuk endpoint yang
        sebenarnya dipegang pemanggil di grant lain.
      properties:
        id_user_role: { type: integer, format: int64 }
        role: { type: string, example: CASHIER }
        id_unit_kerja:
          type: integer
          format: int64
          nullable: true

    LoginResult:
      type: object
      properties:
        token:
          type: string
          description: 'Kirim sebagai header: Authorization: Bearer <token>'
        token_type: { type: string, example: Bearer }
        expires_at:
          type: string
          format: date-time
          description: >
            Waktu absolut, bukan durasi, supaya klien tidak perlu menebak kapan
            responsnya diterima. Ini juga batas satu-satunya token ini bisa
            dicabut — lihat catatan "aktif" di bawah.
        user: { $ref: "#/components/schemas/User" }
        grants:
          type: array
          description: Seluruh grant usable yang dipegang user. Selalu array, tidak pernah null.
          items: { $ref: "#/components/schemas/Grant" }
        aktif:
          allOf: [{ $ref: "#/components/schemas/ActiveContext" }]
          description: >
            Grant yang aktif di token ini. `null` berarti klien harus memanggil
            `POST /auth/switch-context` sebelum bisa memakai endpoint mana pun
            yang butuh role.

    Session:
      type: object
      description: Isi token, yaitu yang dipakai server untuk memutuskan izin.
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        grants:
          type: array
          description: >
            Seluruh grant usable yang dipegang user saat token dibuat. Selalu
            array, tidak pernah null.
          items: { $ref: "#/components/schemas/Grant" }
        aktif:
          allOf: [{ $ref: "#/components/schemas/ActiveContext" }]
          description: Grant yang sedang aktif — satu-satunya yang dipakai mengotorisasi.

    Product:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode_barang: { type: string, example: BRG-001 }
        nama: { type: string, example: Kertas A4 }
        id_satuan_dasar: { type: integer, format: int64 }
        nama_satuan_dasar:
          type: string
          description: Ikut lewat JOIN ke satuan, bukan query terpisah per baris.
        stok_minimum: { type: integer, format: int64 }
        is_aktif: { type: boolean }
        satuan:
          type: array
          description: >
            Hanya pada endpoint detail; tidak ada di list. Diurutkan berdasarkan faktor,
            jadi satuan dasar selalu pertama.
          items: { $ref: "#/components/schemas/ProductSatuan" }
        harga_jual:
          type: array
          description: Hanya pada endpoint detail. Terbaru lebih dulu.
          items: { $ref: "#/components/schemas/ProductHargaJual" }
        created_at: { type: string, format: date-time }
        created_by:
          type: integer
          format: int64
          description: >
            NOT NULL, diambil dari token. Ini modul pertama yang benar-benar mengisi
            kolom pelaku.
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    ProductSatuan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        id_satuan: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor:
          type: integer
          format: int64
          minimum: 1
          description: >
            Berapa satuan dasar yang dimuat satu satuan ini. Bilangan bulat, karena
            kolomnya BIGINT — satuan yang memuat 2,5 satuan dasar tidak bisa diwakili.
        is_default_input: { type: boolean }

    ProductSatuanInput:
      type: object
      required: [id_satuan, faktor]
      properties:
        id_satuan: { type: integer, format: int64, minimum: 1 }
        faktor: { type: integer, format: int64, minimum: 1 }
        is_default_input:
          type: boolean
          default: false
          description: >
            Maksimal satu per produk, ditegakkan partial unique index
            `product_satuan_default_uidx` dari migrasi 000011. Mengirim dua yang bertanda
            dalam satu request buat menjawab 400.

    ProductHargaJual:
      type: object
      properties:
        id: { type: integer, format: int64 }
        id_satuan: { type: integer, format: int64 }
        nama_satuan: { type: string }
        harga: { $ref: "#/components/schemas/Harga" }
        berlaku_dari: { type: string, format: date }
        berlaku_sampai:
          type: string
          format: date
          nullable: true
          description: >
            **Eksklusif**, dan `null` berarti tanpa batas akhir. Versi yang berlaku pada
            suatu tanggal adalah yang `berlaku_dari <= tanggal` dan `berlaku_sampai` null
            atau lebih besar dari tanggal itu.
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64 }

    Harga:
      type: string
      maxLength: 21
      pattern: "^[0-9]+([.][0-9]+)?$"
      description: >
        String desimal, bukan angka floating point, supaya NUMERIC(20,2) yang disimpan
        PostgreSQL sampai ke klien tanpa pembulatan biner.
      example: "50000.00"

    HargaJualBerlaku:
      type: object
      description: >
        Isu #8 fase 1. Satu versi `product_harga_jual` yang berlaku pada tanggal yang
        diminta — bukan seluruh riwayat seperti `ProductHargaJual` di dalam `Product`.
      properties:
        id_harga_jual:
          type: integer
          format: int64
          description: Ini yang dikirim balik sebagai `penjualan_detail.id_harga_jual`.
        id_satuan: { type: integer, format: int64 }
        nama_satuan: { type: string }
        harga: { $ref: "#/components/schemas/Harga" }
        berlaku_dari: { type: string, format: date }
        berlaku_sampai:
          type: string
          format: date
          nullable: true
          description: Eksklusif; `null` berarti tanpa batas akhir. Sama seperti `ProductHargaJual`.

    DaftarHargaJual:
      type: object
      description: >
        Isu #8 fase 3. Satu baris per produk + satuan yang punya harga berlaku pada
        `tanggal`, plus satu baris per produk yang belum punya harga sama sekali —
        untuk baris itu setiap field di bawah `id_satuan` bernilai `null`.
      properties:
        id_product: { type: integer, format: int64 }
        kode_barang: { type: string, example: BRG-001 }
        nama_product: { type: string }
        is_aktif: { type: boolean }
        id_satuan: { type: integer, format: int64, nullable: true }
        nama_satuan: { type: string, nullable: true }
        id_harga_jual: { type: integer, format: int64, nullable: true }
        harga:
          allOf: [{ $ref: "#/components/schemas/Harga" }]
          nullable: true
        berlaku_dari: { type: string, format: date, nullable: true }
        berlaku_sampai: { type: string, format: date, nullable: true }

    Pembelian:
      type: object
      description: >
        Satu dokumen pembelian. Seluruh angka uang dan kuantitas berupa string
        desimal — lihat `Harga` untuk alasannya.
      properties:
        id: { type: integer, format: int64 }
        nomor:
          type: string
          description: Digenerate server, format `BL/2026/08/0001`, mereset tiap bulan.
          example: BL/2026/08/0001
        tanggal: { type: string, format: date-time }
        id_supplier: { type: integer, format: int64 }
        nama_supplier: { type: string }
        id_ruang: { type: integer, format: int64 }
        nama_ruang: { type: string }
        no_faktur_supplier: { type: string, nullable: true }
        tanggal_faktur: { type: string, format: date, nullable: true }
        subtotal:
          type: string
          description: Jumlah subtotal seluruh baris, mengikuti `qty_faktur`. Dihitung server.
          example: "1000000.00"
        diskon_nota: { type: string, example: "0.00" }
        ppn: { type: string, example: "0.00" }
        ppn_dikreditkan: { type: boolean }
        pembulatan: { type: string, example: "0.00" }
        total:
          type: string
          description: >
            `subtotal - diskon_nota + ppn + pembulatan`. **`biaya_angkut` sengaja
            tidak termasuk** — itu tagihan ekspedisi, bukan utang ke supplier, dan
            masuk ke pembukuan lewat `alokasi_biaya` di tiap baris.
          example: "1000000.00"
        id_ekspedisi: { type: integer, format: int64, nullable: true }
        no_resi: { type: string, nullable: true }
        total_koli: { type: string, nullable: true, example: "3.00" }
        tarif_per_koli: { type: string, nullable: true, example: "50000.00" }
        biaya_angkut:
          type: string
          description: >
            `total_koli x tarif_per_koli`, atau `0.00` kalau `ditanggung_supplier`.
          example: "150000.00"
        ditanggung_supplier: { type: boolean }
        metode_alokasi_angkut:
          type: string
          enum: [KOLI, QTY]
          description: >
            Disimpan per dokumen, jadi mengubah metodenya belakangan tidak pernah
            menulis ulang alokasi lama. `KOLI` jatuh ke `QTY` saat seluruh
            `jumlah_koli` nol, supaya tidak membagi dengan nol.
        jenis_pembayaran: { type: string, enum: [TUNAI, KREDIT] }
        status_pembayaran:
          type: string
          enum: [BELUM, SEBAGIAN, LUNAS]
          description: >
            Cache, dihitung ulang dari alokasi POSTED dan retur POSTED. Tidak
            pernah di-set dari form. Modul pembayaran utang yang mengisinya.
        status_penerimaan:
          type: string
          enum: [LENGKAP, KURANG]
          description: >
            Cache atas baris detailnya: `KURANG` kalau ada baris yang diterima
            kurang dari faktur. Dihitung ulang, tidak pernah di-set dari form.
        status: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        detail:
          type: array
          description: Hanya pada endpoint detail. Kuncinya hilang pada list, bukan array kosong.
          items: { $ref: "#/components/schemas/PembelianDetail" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        diajukan_oleh: { type: integer, format: int64, nullable: true }
        diajukan_pada: { type: string, format: date-time, nullable: true }
        disetujui_oleh: { type: integer, format: int64, nullable: true }
        disetujui_pada: { type: string, format: date-time, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        dibatalkan_oleh: { type: integer, format: int64, nullable: true }
        alasan_batal: { type: string, nullable: true }
        alasan_tolak: { type: string, nullable: true }

    PembelianDetail:
      type: object
      description: >
        Satu baris faktur, dengan empat kuantitas dalam dua pasang.
        `qty_faktur`/`qty_dasar` adalah yang tertulis di kertas dan menggerakkan
        utang; `qty_diterima`/`qty_diterima_dasar` adalah hasil hitung fisik dan
        menggerakkan stok. Yang berakhiran `_dasar` dalam satuan dasar produk.
      properties:
        id: { type: integer, format: int64 }
        id_product: { type: integer, format: int64 }
        kode_barang: { type: string }
        nama_product: { type: string }
        qty_faktur: { type: string, example: "100.0000" }
        qty_diterima: { type: string, example: "95.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor_konversi:
          type: integer
          format: int64
          description: >
            Snapshot dari `product_satuan` saat baris ditulis. Master boleh berubah;
            angka ini tidak, atau dokumen lama diam-diam berganti arti.
        qty_dasar: { type: integer, format: int64, example: 100 }
        qty_diterima_dasar: { type: integer, format: int64, example: 95 }
        qty_susulan_dasar:
          type: integer
          format: int64
          description: >
            Jumlah seluruh penerimaan susulan **POSTED** terhadap baris ini. Draft
            tidak dihitung — draft bukan pengiriman.
          example: 0
        selisih_dasar:
          type: integer
          format: int64
          description: >
            `qty_dasar - qty_diterima_dasar`: yang kurang di kiriman pertama. Beku
            setelah dokumen diposting, berapa pun yang menyusul kemudian.
          example: 5
        sisa_dasar:
          type: integer
          format: int64
          description: >
            `selisih_dasar - qty_susulan_dasar`: yang masih jadi tanggungan supplier
            hari ini. Menyusut setiap kali penerimaan susulan diposting.
          example: 5
        qty_retur_dasar:
          type: integer
          format: int64
          description: >
            Jumlah seluruh retur pembelian **POSTED** terhadap baris ini. Draft tidak
            dihitung — draft adalah daftar kemasan, bukan pengiriman.
          example: 0
        qty_dapat_diretur:
          type: integer
          format: int64
          description: >
            `qty_diterima_dasar + qty_susulan_dasar - qty_retur_dasar`: yang masih bisa
            dikirim balik ke supplier.


            Ini sumbu yang berbeda dari tiga angka di atas, dan mencampurnya adalah
            kesalahan yang perlu dihindari: barang yang diretur tetap pernah diterima,
            jadi retur tidak membuat supplier berutang barang lagi dan tidak memberi hak
            atas kiriman susulan. `sisa_dasar` dan `qty_dapat_diretur` bisa sama-sama
            bukan nol pada baris yang sama.
          example: 95
        nama_satuan_dasar: { type: string }
        harga_satuan_input: { type: string, example: "10000.00" }
        diskon_baris: { type: string, example: "0.00" }
        subtotal: { type: string, example: "1000000.00" }
        jumlah_koli:
          type: string
          description: >
            Desimal: satu baris boleh menempati sebagian koli. Diisi petugas gudang
            saat membongkar, jadi biasanya nol saat pertama diinput.
          example: "1.00"
        alokasi_biaya:
          type: string
          description: >
            Bagian ongkir baris ini. Jumlah seluruh baris **persis** sama dengan
            `biaya_angkut`; sisa pembulatan didorong ke baris dengan basis terbesar.
          example: "50000.00"
        harga_pokok_satuan_dasar:
          type: string
          nullable: true
          description: >
            `(subtotal - bagian diskon nota + bagian PPN + alokasi_biaya) /
            qty_dasar` — **bukan** `harga_satuan_input / faktor_konversi`. Null
            sampai dokumen diposting: belum diketahui, bukan hilang.
          example: "10500.0000"
        keterangan_selisih: { type: string, nullable: true }

    PembelianDetailInput:
      type: object
      required: [id_product, id_satuan_input, qty_faktur, harga_satuan_input]
      properties:
        id_product: { type: integer, format: int64, minimum: 1 }
        id_satuan_input:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus sudah terdaftar di `product_satuan` produk itu; kalau tidak,
            400. Tidak ada foreign key yang mengikatnya ke sana.
        qty_faktur: { type: string, example: "100" }
        qty_diterima:
          type: string
          nullable: true
          description: >
            Boleh dikosongkan, dan artinya sama dengan `qty_faktur`. Tidak boleh
            melebihi `qty_faktur`. Berbeda dari `qty_faktur` mewajibkan
            `keterangan_selisih`.
          example: "95"
        harga_satuan_input: { type: string, example: "10000" }
        diskon_baris: { type: string, example: "0" }
        jumlah_koli: { type: string, example: "0" }
        keterangan_selisih: { type: string, nullable: true, maxLength: 500 }

    RiwayatBeli:
      type: object
      description: >
        Pembelian POSTED terakhir satu supplier atas satu produk.


        **Dua harga, dua pertanyaan berbeda.** `harga_satuan_dasar` adalah harga faktur
        per satuan dasar setelah diskon baris — itu yang dibandingkan dengan penawaran
        supplier berikutnya. `harga_pokok_satuan_dasar` adalah harga setelah diskon nota,
        bagian PPN, dan ongkir — itu yang dipakai menilai margin. Melaporkan salah satu
        saja membuat satu dari dua pertanyaan itu tidak terjawab.


        `harga_satuan_input` sengaja bukan angka pembanding: satuannya mengikuti apa yang
        diketik, jadi 12.000/DUS dan 1.000/PCS terlihat jauh berbeda padahal sama. Tetap
        dilaporkan karena itu angka yang tercetak di kertas.
      properties:
        id_supplier: { type: integer, format: int64 }
        nama_supplier: { type: string }
        id_pembelian: { type: integer, format: int64 }
        nomor: { type: string, example: BL/2026/08/0001 }
        tanggal: { type: string, format: date-time }
        no_faktur_supplier: { type: string, nullable: true }
        id_pembelian_detail: { type: integer, format: int64 }
        qty_faktur: { type: string, example: "10.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string, example: DUS }
        faktor_konversi: { type: integer, format: int64, example: 12 }
        qty_dasar: { type: integer, format: int64, example: 120 }
        nama_satuan_dasar: { type: string, example: PCS }
        harga_satuan_input:
          type: string
          description: Per satuan input, seperti tertulis di nota.
          example: "120000.00"
        diskon_baris: { type: string, example: "0.00" }
        subtotal: { type: string, example: "1200000.00" }
        alokasi_biaya: { type: string, example: "60000.00" }
        harga_satuan_dasar:
          type: string
          description: >
            `subtotal / qty_dasar`. Harga faktur per satuan dasar, jadi bisa dibandingkan
            antar supplier yang memakai kemasan berbeda.
          example: "10000.0000"
        harga_pokok_satuan_dasar:
          type: string
          nullable: true
          description: >
            Harga pokok setelah ongkir, disalin dari baris pembeliannya. Tidak pernah
            null pada endpoint ini — hanya dokumen POSTED yang dibaca, dan posting yang
            mengisinya.
          example: "10500.0000"

    SisaPembelian:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nomor: { type: string }
        id_supplier: { type: integer, format: int64 }
        nama_supplier: { type: string }
        status: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        status_penerimaan: { type: string, enum: [LENGKAP, KURANG] }
        baris:
          type: array
          items:
            type: object
            properties:
              id_pembelian_detail: { type: integer, format: int64 }
              id_product: { type: integer, format: int64 }
              kode_barang: { type: string }
              nama_product: { type: string }
              qty_dasar: { type: integer, format: int64 }
              qty_diterima_dasar: { type: integer, format: int64 }
              qty_susulan_dasar: { type: integer, format: int64 }
              sisa_dasar: { type: integer, format: int64 }
              nama_satuan_dasar: { type: string }
              keterangan_selisih: { type: string, nullable: true }

    PenerimaanSusulan:
      type: object
      description: >
        Kiriman kedua untuk barang yang belum datang di kiriman pertama.


        Tidak punya `total`, `ppn`, maupun `status_pembayaran`, karena ia bukan
        tagihan: faktur supplier terbit penuh di kiriman pertama dan sudah dibukukan
        penuh di sana. `total_nilai` adalah nilai barang yang datang terlambat, yang
        dibawa masuk ke persediaan — bukan uang yang terutang.
      properties:
        id: { type: integer, format: int64 }
        nomor:
          type: string
          description: Seri sendiri, terpisah dari pembelian.
          example: PS/2026/08/0001
        tanggal: { type: string, format: date-time }
        id_pembelian: { type: integer, format: int64 }
        nomor_pembelian: { type: string }
        id_supplier:
          type: integer
          format: int64
          description: Disalin dari pembelian, bukan dipilih.
        nama_supplier: { type: string }
        id_ruang:
          type: integer
          format: int64
          description: >
            Disalin dari pembelian. Barang yang perlu pindah ruang setelah diterima
            adalah pekerjaan mutasi, bukan penerimaan.
        nama_ruang: { type: string }
        keterangan: { type: string, nullable: true }
        total_nilai:
          type: string
          description: Nilai barang yang menyusul. Dihitung ulang dari barisnya.
          example: "52500.00"
        status: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        detail:
          type: array
          description: Hanya pada endpoint detail. Kuncinya hilang pada list.
          items: { $ref: "#/components/schemas/PenerimaanSusulanDetail" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        diajukan_oleh: { type: integer, format: int64, nullable: true }
        diajukan_pada: { type: string, format: date-time, nullable: true }
        disetujui_oleh: { type: integer, format: int64, nullable: true }
        disetujui_pada: { type: string, format: date-time, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        dibatalkan_oleh: { type: integer, format: int64, nullable: true }
        alasan_batal: { type: string, nullable: true }
        alasan_tolak: { type: string, nullable: true }

    PenerimaanSusulanDetail:
      type: object
      description: >
        Satu baris, menunjuk baris faktur yang dilengkapinya — produknya adalah
        produk baris itu.
      properties:
        id: { type: integer, format: int64 }
        id_pembelian_detail: { type: integer, format: int64 }
        id_product: { type: integer, format: int64 }
        kode_barang: { type: string }
        nama_product: { type: string }
        qty_input: { type: string, example: "5.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor_konversi:
          type: integer
          format: int64
          description: >
            Snapshot dari `product_satuan` saat baris ditulis. Diambil segar karena
            kuantitasnya adalah hitungan baru dan boleh dalam satuan yang berbeda
            dari yang dipakai faktur.
        qty_dasar: { type: integer, format: int64, example: 5 }
        nama_satuan_dasar: { type: string }
        harga_pokok_satuan_dasar:
          type: string
          description: >
            **Disalin dari baris pembelian**, tidak pernah dihitung ulang dan tidak
            pernah dibaca dari rata-rata bergerak terkini. Harga barang sudah
            ditetapkan faktur; kiriman keduanya tidak mengubahnya. Ini juga yang
            membuat pembelian dan seluruh susulannya berjumlah persis nilai faktur.
          example: "10500.0000"
        nilai:
          type: string
          description: "`qty_dasar x harga_pokok_satuan_dasar`."
          example: "52500.00"

    PenerimaanSusulanDetailInput:
      type: object
      required: [id_pembelian_detail, id_satuan_input, qty_input]
      properties:
        id_pembelian_detail:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus milik pembelian di header, dan harga pokoknya harus sudah terisi
            (yaitu pembeliannya sudah POSTED). Satu baris pembelian hanya boleh
            muncul sekali per dokumen.
        id_satuan_input:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus terdaftar di `product_satuan` produk itu. Boleh berbeda dari satuan
            yang dipakai baris fakturnya — lima pcs kurang dari baris yang diketik
            dalam dus adalah kasus yang wajar.
        qty_input:
          type: string
          description: >
            Tidak boleh melebihi sisa baris itu
            (`qty_dasar - qty_diterima_dasar - Σ susulan POSTED`), setelah dikonversi
            ke satuan dasar. `qty x faktor` wajib bilangan bulat.
          example: "5"

    ReturPembelian:
      type: object
      description: >
        Barang yang dikembalikan ke supplier. Cermin dari penerimaan susulan: sama-sama
        menunjuk baris `pembelian_detail` dan sama-sama menyalin harga pokoknya dari
        sana, arah barangnya saja yang berlawanan.


        Tidak punya `ppn` maupun `status_pembayaran`. Berapa yang dikreditkan supplier
        diselesaikan dengan mereka di atas nota; dokumen ini mencatat apa yang keluar
        dari gudang dan berapa nilainya.
      properties:
        id: { type: integer, format: int64 }
        nomor:
          type: string
          description: Seri sendiri, terpisah dari pembelian dan penerimaan susulan.
          example: RB/2026/08/0001
        tanggal: { type: string, format: date-time }
        id_pembelian: { type: integer, format: int64 }
        nomor_pembelian: { type: string }
        id_supplier:
          type: integer
          format: int64
          description: Disalin dari pembelian, bukan dipilih.
        nama_supplier: { type: string }
        id_ruang:
          type: integer
          format: int64
          description: >
            Disalin dari pembelian — tempat barangnya ditaruh saat datang. Barang yang
            perlu dikembalikan dari ruang lain adalah pekerjaan mutasi lebih dulu.
        nama_ruang: { type: string }
        alasan:
          type: string
          nullable: true
          description: >
            Nullable di skema tetapi wajib diisi aplikasi. Ia satu-satunya catatan kenapa
            barang yang sudah dibayar dikirim balik.
        total:
          type: string
          description: >
            Nilai persediaan yang keluar menurut faktur, dihitung ulang dari barisnya dan
            tidak pernah di-set dari form. **Bukan otomatis sama dengan yang dikreditkan
            supplier**, dan bukan angka yang dicatat kartu stok — lihat
            `harga_pokok_satuan_dasar` pada barisnya.
          example: "1000000.00"
        nilai_kredit_utang:
          type: string
          description: >
            Berapa yang dikreditkan supplier atas barang ini, dan **bukan `total`**.
            `total` adalah nilai persediaan menurut harga pokok, dan harga pokok memuat
            porsi ongkir yang dibayar ke ekspedisi — mengkreditkannya berarti memberi
            supplier uang yang tidak pernah ia terima.


            Dihitung `pembelian.total x nilai_faktur_retur / pembelian.subtotal`, jadi
            diskon nota dan PPN ikut terskala. Nol selama dokumen belum POSTED, dibekukan
            saat posting, dan tetap tertinggal pada dokumen `BATAL` sebagai catatan berapa
            yang pernah diklaim — penghitungan ulang utang hanya menjumlahkan retur POSTED.
          example: "1000000.00"
        status: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        detail:
          type: array
          description: Hanya pada endpoint detail. Kuncinya hilang pada list.
          items: { $ref: "#/components/schemas/ReturPembelianDetail" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        diajukan_oleh: { type: integer, format: int64, nullable: true }
        diajukan_pada: { type: string, format: date-time, nullable: true }
        disetujui_oleh: { type: integer, format: int64, nullable: true }
        disetujui_pada: { type: string, format: date-time, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        dibatalkan_oleh: { type: integer, format: int64, nullable: true }
        alasan_batal: { type: string, nullable: true }
        alasan_tolak: { type: string, nullable: true }

    ReturPembelianDetail:
      type: object
      description: >
        Satu baris, menunjuk baris faktur yang barangnya masuk lewat sana — produknya
        adalah produk baris itu.
      properties:
        id: { type: integer, format: int64 }
        id_pembelian_detail: { type: integer, format: int64 }
        id_product: { type: integer, format: int64 }
        kode_barang: { type: string }
        nama_product: { type: string }
        qty_input: { type: string, example: "1.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor_konversi:
          type: integer
          format: int64
          description: >
            Snapshot dari `product_satuan` saat baris ditulis. Diambil segar karena
            kuantitasnya adalah hitungan baru atas barang yang sedang dikemas dan boleh
            dalam satuan yang berbeda dari yang dipakai faktur.
        qty_dasar: { type: integer, format: int64, example: 12 }
        nama_satuan_dasar: { type: string }
        harga_pokok_satuan_dasar:
          type: string
          description: >
            **Disalin dari baris pembelian**, tidak pernah dibaca dari rata-rata bergerak
            terkini. Tanpa itu pembelian dan returnya tidak saling menghapus — dan itulah
            yang menurut migrasi `000005` menjadi alasan kolom ini ada.
          example: "10000.0000"
        nilai:
          type: string
          description: >
            `qty_dasar x harga_pokok_satuan_dasar` — nilai barangnya menurut faktur.
            **Bukan** yang dicatat `kartu_stok` sebagai keluar: trigger menilai setiap
            baris keluar pada rata-rata bergerak yang berlaku saat itu, karena barangnya
            sudah tercampur dengan stok lama sejak ia datang. Dua-duanya jawaban benar
            untuk pertanyaan yang berbeda.
          example: "120000.00"

    ReturPembelianDetailInput:
      type: object
      required: [id_pembelian_detail, id_satuan_input, qty_input]
      properties:
        id_pembelian_detail:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus milik pembelian di header, dan harga pokoknya harus sudah terisi (yaitu
            pembeliannya sudah POSTED). Satu baris pembelian hanya boleh muncul sekali per
            dokumen.
        id_satuan_input:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus terdaftar di `product_satuan` produk itu. Boleh berbeda dari satuan yang
            dipakai baris fakturnya — satu dus dikembalikan dari baris yang diketik dalam
            pcs adalah kasus yang wajar.
        qty_input:
          type: string
          description: >
            Tidak boleh melebihi yang bisa diretur
            (`qty_diterima_dasar + Σ susulan POSTED − Σ retur POSTED`), setelah dikonversi
            ke satuan dasar. Perhatikan bahwa `qty_dasar` tidak ikut: barang yang tidak
            pernah datang tidak bisa dikirim balik. `qty x faktor` wajib bilangan bulat.
          example: "1"

    Mutasi:
      type: object
      description: >
        Perpindahan barang antar `ruang`. Dokumen keempat yang menulis `kartu_stok` dan
        yang pertama menulis ke dua arah sekaligus: satu baris detail menghasilkan
        `MUTASI_KELUAR` di ruang asal dan `MUTASI_MASUK` di ruang tujuan, dalam satu
        transaksi.


        Tidak ada satu pun kolom uang di header, dan ketiadaan itu adalah bentuk modulnya
        — bukan kelalaian. Mutasi tidak menagih siapa pun: ia memindahkan barang, dan
        berapa nilainya diputuskan per baris oleh trigger `kartu_stok` saat posting.


        Alurnya `DRAFT → POSTED → BATAL`, tanpa `DIAJUKAN` — satu-satunya penulis
        `kartu_stok` yang begitu. Karena itu tidak ada `diajukan_oleh`, `disetujui_oleh`,
        maupun `alasan_tolak` di sini.
      properties:
        id: { type: integer, format: int64 }
        nomor:
          type: string
          description: Seri sendiri, terpisah dari dokumen lain.
          example: MT/2026/08/0001
        tanggal: { type: string, format: date-time }
        id_ruang_asal: { type: integer, format: int64 }
        nama_ruang_asal: { type: string }
        id_ruang_tujuan:
          type: integer
          format: int64
          description: Wajib berbeda dari `id_ruang_asal` (`mutasi_ruang_check`).
        nama_ruang_tujuan: { type: string }
        keterangan: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, POSTED, BATAL] }
        detail:
          type: array
          description: Hanya pada endpoint detail. Kuncinya hilang pada list.
          items: { $ref: "#/components/schemas/MutasiDetail" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        posted_at: { type: string, format: date-time, nullable: true }
        dibatalkan_oleh: { type: integer, format: int64, nullable: true }
        alasan_batal: { type: string, nullable: true }

    MutasiDetail:
      type: object
      description: >
        Satu baris: satu produk dan satu kuantitas, berpindah di antara kedua ruang yang
        disebut header. Menunjuk produk secara langsung, tidak seperti
        `penerimaan-susulan` dan `retur-pembelian` yang menunjuk baris dokumen lain —
        mutasi tidak punya dokumen induk.
      properties:
        id: { type: integer, format: int64 }
        id_product: { type: integer, format: int64 }
        kode_barang: { type: string }
        nama_product: { type: string }
        qty_input: { type: string, example: "30.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor_konversi:
          type: integer
          format: int64
          description: Snapshot dari `product_satuan` saat baris ditulis.
        qty_dasar: { type: integer, format: int64, example: 30 }
        nama_satuan_dasar: { type: string }
        harga_pokok_satuan_dasar:
          type: string
          nullable: true
          description: >
            **Null sampai dokumennya diposting**, dan itu memang gunanya kolom ini
            nullable. Harga pokok mutasi adalah rata-rata bergerak ruang asal pada saat
            posting, dan aplikasi tidak bisa menghitungnya sendiri: angka itu hanya
            diketahui trigger `kartu_stok`, yang membacanya di dalam advisory lock. Yang
            tersimpan di sini adalah salinan dari apa yang dilaporkan baris keluar.
          example: "10000.0000"

    MutasiDetailInput:
      type: object
      required: [id_product, id_satuan_input, qty_input]
      properties:
        id_product:
          type: integer
          format: int64
          minimum: 1
          description: >
            Boleh muncul lebih dari sekali dalam satu dokumen, tidak seperti tiga dokumen
            yang kuotanya dipegang baris dokumen induk. Di sini kuotanya saldo ruang asal
            dan seluruh baris untuk produk yang sama dijumlahkan terhadapnya — 2 DUS dan
            3 PCS barang yang sama adalah dua baris yang sah.
        id_satuan_input:
          type: integer
          format: int64
          minimum: 1
          description: Harus terdaftar di `product_satuan` produk itu.
        qty_input:
          type: string
          description: >
            Setelah dikonversi ke satuan dasar, jumlah seluruh baris untuk satu produk
            tidak boleh melebihi saldo ruang asal. `qty x faktor` wajib bilangan bulat.
          example: "30"

    StokRuang:
      type: object
      description: >
        Saldo satu produk di satu ruang: baris terakhir sebuah rantai `kartu_stok`,
        dibaca dan bukan dihitung ulang.


        Bukan jaminan. Angkanya bisa sudah bergerak sebelum klien menindaklanjutinya —
        yang memutuskan saldo adalah trigger, di dalam advisory lock.
      properties:
        id_ruang: { type: integer, format: int64 }
        nama_ruang: { type: string }
        stok_akhir:
          type: integer
          format: int64
          description: Selalu dalam satuan dasar. `kartu_stok` tidak mengenal satuan lain.
          example: 70
        nilai_akhir:
          type: string
          description: >
            Nilai persediaan atas kuantitas itu. Stok nol memaksa nilainya tepat nol,
            sehingga sisa pembulatan tidak menumpuk jadi rupiah hantu di gudang kosong.
          example: "700000.00"
        harga_pokok_satuan:
          type: string
          description: Rata-rata bergerak yang berlaku di ruang itu.
          example: "10000.0000"
        tanggal_transaksi:
          type: string
          format: date-time
          nullable: true
          description: Tanggal pergerakan terakhir menurut dokumennya.
        terakhir_diperbarui:
          type: string
          format: date-time
          nullable: true
          description: >
            Kapan pergerakan itu dicatat. Berbeda dari `tanggal_transaksi` setiap kali
            dokumennya diketik terlambat, yang merupakan kasus biasa.

    PembayaranUtang:
      type: object
      description: >
        Uang yang keluar ke supplier. Setiap angka uang adalah string desimal, bukan
        angka JSON: `NUMERIC(20,2)` lewat float kehilangan sen, dan angka-angka ini yang
        direkonsiliasi dengan rekening bank.


        Statusnya `DRAFT -> POSTED -> BATAL`, **tanpa `DIAJUKAN`**. Tahap persetujuan di
        `pembelian` ada karena kartu stok append-only sehingga posting yang salah hanya
        bisa dibalik; alokasi pembayaran bisa dibatalkan dan seluruh cache dihitung ulang
        persis, jadi menirunya berarti meniru mekanisme tanpa alasannya.
      properties:
        id: { type: integer, format: int64 }
        nomor:
          type: string
          description: Digenerate server, seri `PU` yang terpisah dari `BL`, `PS`, dan `RB`.
          example: PU/2026/08/0001
        tanggal: { type: string, format: date-time }
        id_supplier: { type: integer, format: int64 }
        nama_supplier: { type: string }
        metode: { type: string, enum: [TUNAI, TRANSFER, GIRO] }
        no_referensi:
          type: string
          nullable: true
          description: Nomor transfer, nomor warkat giro, atau nomor kuitansi.
        nama_bank: { type: string, nullable: true }
        tanggal_jatuh_tempo_giro: { type: string, format: date, nullable: true }
        tanggal_cair:
          type: string
          format: date
          nullable: true
          description: Terisi tepat ketika `status_giro` bernilai `CAIR`, ditegakkan CHECK.
        status_giro:
          type: string
          nullable: true
          enum: [BELUM_CAIR, CAIR, TOLAK]
          description: >
            Null untuk metode selain `GIRO`, dan wajib ada untuk `GIRO`.


            **Menentukan apakah pembayaran ini mengurangi apa pun.** `BELUM_CAIR` dan
            `TOLAK` meninggalkan setiap utang tepat di tempatnya — menyerahkan giro tidak
            menyelesaikan apa pun, yang menyelesaikan adalah giro yang cair.
        jumlah:
          type: string
          description: Uang yang keluar. Harus lebih dari nol.
          example: "400000.00"
        jumlah_dialokasikan:
          type: string
          description: >
            Dihitung ulang dari baris alokasi, tidak pernah di-set dari form. **Boleh
            lebih kecil dari `jumlah`**, dan itu normal: sisanya mengendap sebagai kredit
            di supplier untuk faktur berikutnya.
          example: "400000.00"
        sisa_belum_dialokasikan:
          type: string
          description: >
            `jumlah − jumlah_dialokasikan`. Dilaporkan alih-alih diserahkan ke klien untuk
            dikurangkan sendiri, karena inilah angka yang menyatakan apakah pembayaran ini
            masih punya ruang.
          example: "0.00"
        status: { type: string, enum: [DRAFT, POSTED, BATAL] }
        keterangan: { type: string, nullable: true }
        alokasi:
          type: array
          description: Hanya pada endpoint detail. Kuncinya hilang pada list.
          items: { $ref: "#/components/schemas/PembayaranUtangAlokasi" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        posted_at: { type: string, format: date-time, nullable: true }
        dibatalkan_oleh: { type: integer, format: int64, nullable: true }
        alasan_batal: { type: string, nullable: true }

    PembayaranUtangAlokasi:
      type: object
      description: >
        Satu bagian pembayaran yang ditujukan ke satu faktur. Hubungan pembayaran dengan
        faktur banyak-ke-banyak, karena itulah alokasi jadi tabel tersendiri.
      properties:
        id: { type: integer, format: int64 }
        id_pembelian: { type: integer, format: int64 }
        nomor_pembelian: { type: string, example: BL/2026/08/0001 }
        no_faktur_supplier: { type: string, nullable: true }
        total_pembelian:
          type: string
          description: Keadaan faktur sekarang, supaya layar pembayaran bisa menyebut apa yang ditutupnya.
          example: "1050000.00"
        status_pembayaran: { type: string, enum: [BELUM, SEBAGIAN, LUNAS] }
        jumlah: { type: string, example: "400000.00" }
        created_at: { type: string, format: date-time }

    PembayaranUtangAlokasiInput:
      type: object
      required: [id_pembelian, jumlah]
      properties:
        id_pembelian:
          type: integer
          format: int64
          minimum: 1
          description: >
            Fakturnya harus `POSTED` dan milik supplier yang sama dengan pembayarannya.
            `DRAFT` cuma kertas yang sudah diketik dan `BATAL` adalah utang yang ditarik
            kembali; keduanya tidak bisa dibayar.


            Satu faktur hanya boleh muncul sekali per pembayaran.
        jumlah:
          type: string
          description: >
            String desimal, harus lebih dari nol. Tidak boleh melebihi sisa utang faktur
            itu — yang sudah memperhitungkan alokasi efektif lain dan kredit retur POSTED —
            dan seluruh alokasi bersama tidak boleh melebihi `jumlah` pembayarannya.
          example: "400000"

    UtangSupplier:
      type: object
      description: >
        Satu faktur yang masih terbuka: daftar kerja untuk menyusun pembayaran. Seperti
        riwayat harga beli, ini query dan bukan modul — tidak ada tabel dan tidak ada
        migrasi di belakangnya.
      properties:
        id_pembelian: { type: integer, format: int64 }
        nomor: { type: string, example: BL/2026/08/0001 }
        tanggal: { type: string, format: date-time }
        no_faktur_supplier: { type: string, nullable: true }
        tanggal_faktur: { type: string, format: date, nullable: true }
        jenis_pembayaran: { type: string, enum: [TUNAI, KREDIT] }
        status_pembayaran: { type: string, enum: [BELUM, SEBAGIAN, LUNAS] }
        total:
          type: string
          description: Yang ditagih supplier. Tidak memuat ongkir — itu tagihan ekspedisi.
          example: "1050000.00"
        jumlah_dialokasikan:
          type: string
          description: >
            Hanya alokasi **efektif**: dari pembayaran `POSTED`, dan untuk giro hanya yang
            sudah `CAIR`. Giro yang belum cair tidak dihitung di sini.
          example: "400000.00"
        nilai_kredit_retur:
          type: string
          description: Jumlah `nilai_kredit_utang` dari retur POSTED atas faktur ini.
          example: "0.00"
        sisa_utang:
          type: string
          description: "`total − jumlah_dialokasikan − nilai_kredit_retur`."
          example: "650000.00"

    Role:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nama: { type: string, example: CASHIER }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    User:
      type: object
      description: >
        Tidak punya field password, bahkan hash-nya. Satu-satunya jalan hash
        sampai ke klien adalah kalau seseorang menambahkan fieldnya di sini.
      properties:
        id: { type: integer, format: int64 }
        username: { type: string, example: kasir_pagi }
        email: { type: string, format: email, nullable: true }
        nama_lengkap: { type: string, nullable: true }
        is_aktif: { type: boolean }
        roles:
          type: array
          description: >
            Seluruh grant yang dipegang user; satu user boleh punya banyak. Selalu
            array, tidak pernah `null`, jadi `roles.length` aman dibaca di setiap
            baris. Diurutkan berdasarkan nama role lalu unit (grant global lebih
            dulu).


            Isu #12 fase 3: satu grant adalah (role, unit_kerja), bukan cuma role
            lagi, jadi role yang sama bisa muncul lebih dari sekali di sini — satu
            baris per unit tempat ia diberikan. "INVENTARIS di outlet A" dan
            "INVENTARIS di outlet B" adalah dua baris, bukan duplikat.


            Termasuk grant yang rolenya, atau unitnya, dipensiunkan setelah
            diberikan — pemberiannya masih nyata dan masih perlu dicabut. Bedakan
            lewat `is_aktif` di dalamnya.
          items: { $ref: "#/components/schemas/RoleRef" }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    RoleRef:
      type: object
      description: >
        Bentuk ringkas satu grant di dalam user. Kolom audit role tidak diulang di
        setiap baris daftar user.
      properties:
        id: { type: integer, format: int64 }
        nama: { type: string, example: CASHIER }
        is_aktif: { type: boolean }
        id_user_role:
          type: integer
          format: int64
          description: >
            Id baris user_role itu sendiri — identitas grant ini, bukan
            identitas rolenya. Isu #12 fase 4: ini yang dikirim sebagai
            id_user_role ke POST /auth/switch-context.
        id_unit_kerja:
          type: integer
          format: int64
          nullable: true
          description: >
            Unit tempat grant ini berlaku. `null` berarti berlaku di seluruh unit
            — bentuk grant SUPERADMIN.
        nama_unit_kerja:
          type: string
          nullable: true
          description: Diambil sekalian lewat JOIN, null kalau id_unit_kerja null.
        is_aktif_unit_kerja:
          type: boolean
          nullable: true
          description: >
            Versi is_aktif untuk unitnya. null persis ketika id_unit_kerja null
            — grant global tidak punya unit yang bisa dipensiunkan.

    Grant:
      type: object
      required: [id_role]
      description: >
        Satu role untuk diberikan, dan di mana — isu #12 fase 3. `id_unit_kerja`
        yang tidak diisi (atau `null`) memberi role itu di seluruh unit, bentuk
        grant SUPERADMIN; diisi berarti grant itu hanya berlaku di unit tersebut,
        dan role yang sama boleh diberikan lagi untuk unit lain lewat entri
        `Grant` kedua.
      properties:
        id_role: { type: integer, format: int64, minimum: 1 }
        id_unit_kerja:
          type: integer
          format: int64
          minimum: 1
          nullable: true

    Grants:
      type: array
      maxItems: 32
      items: { $ref: "#/components/schemas/Grant" }
      description: >
        Grant yang dipegang user. Pasangan (id_role, id_unit_kerja) yang berulang
        dianggap satu — jelas berarti "beri grant itu sekali".


        id_role yang tidak ada atau rolenya sudah `is_aktif: false` ditolak 400,
        begitu juga id_unit_kerja yang tidak ada atau unitnya sudah
        `is_aktif: false` — bukan diabaikan diam-diam.
      example: [2, 3]

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      description: >
        Hanya dikirim masuk, sekali. Di-hash dengan bcrypt di lapisan usecase dan
        tidak pernah disimpan, dicatat di log, atau dikembalikan.


        Batas 72 adalah batas masukan bcrypt. Validator menghitung rune sedangkan
        bcrypt menghitung byte, jadi password 72 karakter yang mengandung rune
        multibyte tetap ditolak 400, hanya pesannya yang berbeda.

    PageMetadata:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        total_item: { type: integer, format: int64 }
        total_page: { type: integer, format: int64 }

  responses:
    Error:
      description: Request gagal
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { nullable: true, example: null }
              errors: { type: string, example: "supplier not found" }

    ValidationError:
      description: Payload tidak lolos validasi
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { nullable: true, example: null }
              errors: { type: string, example: "validation failed" }
              validation_errors:
                type: object
                additionalProperties: { type: string }
                example: { "Nama": "required" }
