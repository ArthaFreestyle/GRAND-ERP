    post:
      tags: [retur-pembelian]
      summary: Buat draft retur pembelian
      operationId: createReturPembelian
      description: >
        Barang yang dikembalikan ke supplier. Cermin dari penerimaan susulan:
        sama-sama menunjuk baris `pembelian_detail` dan sama-sama menyalin harga
        pokoknya dari sana, arah barangnya saja yang berlawanan.


        **Pembelian asalnya harus `POSTED`.** Sebelum itu barisnya belum punya
        `harga_pokok_satuan_dasar` untuk disalin, dan belum ada barang yang datang
        untuk dikirim balik.


        `id_supplier` dan `id_ruang` tidak ada di body: keduanya disalin dari
        pembelian. Suppliernya adalah yang menjual barangnya, dan ruangnya adalah
        tempat pembelian itu menaruhnya — barang yang perlu dikembalikan dari ruang
