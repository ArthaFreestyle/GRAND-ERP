      operationId: updatePelanggan
      description: >
        Field yang tidak dikirim tidak diubah. `"plafon_kredit": null` mencabut
        batas kredit sepenuhnya — itu bukan sama dengan menyetelnya ke 0.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                kode: { type: string, maxLength: 32, nullable: true }
                nama: { type: string, maxLength: 255 }
                telepon: { type: string, maxLength: 32, nullable: true }
                alamat: { type: string, maxLength: 1000, nullable: true }
                npwp: { type: string, maxLength: 32, nullable: true }
                plafon_kredit: { $ref: "#/components/schemas/PlafonKredit" }
                is_aktif: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Pelanggan" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token dari `POST /api/v1/auth/login`, dikirim sebagai
        `Authorization: Bearer <token>`.


        Token bersifat stateless dan **tidak bisa dicabut**. Menonaktifkan user atau
        mencabut rolenya tidak mempengaruhi token yang sudah keluar; aksesnya baru
        hilang saat token kedaluwarsa, sesuai `jwt.ttl_minutes` (default 60 menit).

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }

    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    IsAktif:
      name: is_aktif
      in: query
      description: Kosongkan untuk menampilkan baris aktif maupun tidak aktif.
      schema: { type: boolean }

  schemas:
    Ruang:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode: { type: string, nullable: true }
        nama_ruang: { type: string }
        is_aktif: { type: boolean }

    Satuan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nama: { type: string }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    Ekspedisi:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nama: { type: string }
        telepon: { type: string, nullable: true }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    Supplier:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode: { type: string, nullable: true }
        nama: { type: string }
        telepon: { type: string, nullable: true }
        alamat: { type: string, nullable: true }
        npwp: { type: string, nullable: true }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        nama_pembuat:
          type: string
          nullable: true
          description: >
            Diambil sekalian lewat LEFT JOIN ke users, bukan query terpisah per
            baris. Null selama modul autentikasi belum ada.
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    Pelanggan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode: { type: string, nullable: true }
        nama: { type: string }
        telepon: { type: string, nullable: true }
        alamat: { type: string, nullable: true }
        npwp: { type: string, nullable: true }
        plafon_kredit: { $ref: "#/components/schemas/PlafonKredit" }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        nama_pembuat:
          type: string
          nullable: true
          description: Diambil lewat LEFT JOIN ke users, bukan query per baris.
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    PlafonKredit:
      type: string
      nullable: true
      maxLength: 21
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: >
        Batas kredit sebagai string desimal, bukan angka floating point, supaya
        nilai yang disimpan PostgreSQL sampai ke klien tanpa pembulatan biner.


        `null` berarti **tanpa batas**, bukan nol. Nilai negatif ditolak 400.
      example: "15000000.00"

    LoginResult:
      type: object
      properties:
        token:
          type: string
          description: 'Kirim sebagai header: Authorization: Bearer <token>'
        token_type: { type: string, example: Bearer }
        expires_at:
          type: string
          format: date-time
          description: >
            Waktu absolut, bukan durasi, supaya klien tidak perlu menebak kapan
            responsnya diterima. Ini juga batas satu-satunya sesi ini bisa dicabut.
        user: { $ref: "#/components/schemas/User" }

    Session:
      type: object
      description: Isi token, yaitu yang dipakai server untuk memutuskan izin.
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        roles:
          type: array
          description: >
            Nama role yang dipegang saat token dibuat, hanya yang aktif. Selalu array,
            tidak pernah null.
          items: { type: string, example: SUPERADMIN }

    Product:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kode_barang: { type: string, example: BRG-001 }
        nama: { type: string, example: Kertas A4 }
        id_satuan_dasar: { type: integer, format: int64 }
        nama_satuan_dasar:
          type: string
          description: Ikut lewat JOIN ke satuan, bukan query terpisah per baris.
        stok_minimum: { type: integer, format: int64 }
        is_aktif: { type: boolean }
        satuan:
          type: array
          description: >
            Hanya pada endpoint detail; tidak ada di list. Diurutkan berdasarkan faktor,
            jadi satuan dasar selalu pertama.
          items: { $ref: "#/components/schemas/ProductSatuan" }
        harga_jual:
          type: array
          description: Hanya pada endpoint detail. Terbaru lebih dulu.
          items: { $ref: "#/components/schemas/ProductHargaJual" }
        created_at: { type: string, format: date-time }
        created_by:
          type: integer
          format: int64
          description: >
            NOT NULL, diambil dari token. Ini modul pertama yang benar-benar mengisi
            kolom pelaku.
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    ProductSatuan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        id_satuan: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor:
          type: integer
          format: int64
          minimum: 1
          description: >
            Berapa satuan dasar yang dimuat satu satuan ini. Bilangan bulat, karena
            kolomnya BIGINT — satuan yang memuat 2,5 satuan dasar tidak bisa diwakili.
        is_default_input: { type: boolean }

    ProductSatuanInput:
      type: object
      required: [id_satuan, faktor]
      properties:
        id_satuan: { type: integer, format: int64, minimum: 1 }
        faktor: { type: integer, format: int64, minimum: 1 }
        is_default_input:
          type: boolean
          default: false
          description: >
            Maksimal satu per produk, ditegakkan partial unique index
            `product_satuan_default_uidx` dari migrasi 000011. Mengirim dua yang bertanda
            dalam satu request buat menjawab 400.

    ProductHargaJual:
      type: object
      properties:
        id: { type: integer, format: int64 }
        id_satuan: { type: integer, format: int64 }
        nama_satuan: { type: string }
        harga: { $ref: "#/components/schemas/Harga" }
        berlaku_dari: { type: string, format: date }
        berlaku_sampai:
          type: string
          format: date
          nullable: true
          description: >
            **Eksklusif**, dan `null` berarti tanpa batas akhir. Versi yang berlaku pada
            suatu tanggal adalah yang `berlaku_dari <= tanggal` dan `berlaku_sampai` null
            atau lebih besar dari tanggal itu.
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64 }

    Harga:
      type: string
      maxLength: 21
      pattern: "^[0-9]+([.][0-9]+)?$"
      description: >
        String desimal, bukan angka floating point, supaya NUMERIC(20,2) yang disimpan
        PostgreSQL sampai ke klien tanpa pembulatan biner.
      example: "50000.00"

    Pembelian:
      type: object
      description: >
        Satu dokumen pembelian. Seluruh angka uang dan kuantitas berupa string
        desimal — lihat `Harga` untuk alasannya.
      properties:
        id: { type: integer, format: int64 }
        nomor:
          type: string
          description: Digenerate server, format `BL/2026/08/0001`, mereset tiap bulan.
          example: BL/2026/08/0001
        tanggal: { type: string, format: date-time }
        id_supplier: { type: integer, format: int64 }
        nama_supplier: { type: string }
        id_ruang: { type: integer, format: int64 }
        nama_ruang: { type: string }
        no_faktur_supplier: { type: string, nullable: true }
        tanggal_faktur: { type: string, format: date, nullable: true }
        subtotal:
          type: string
          description: Jumlah subtotal seluruh baris, mengikuti `qty_faktur`. Dihitung server.
          example: "1000000.00"
        diskon_nota: { type: string, example: "0.00" }
        ppn: { type: string, example: "0.00" }
        ppn_dikreditkan: { type: boolean }
        pembulatan: { type: string, example: "0.00" }
        total:
          type: string
          description: >
            `subtotal - diskon_nota + ppn + pembulatan`. **`biaya_angkut` sengaja
            tidak termasuk** — itu tagihan ekspedisi, bukan utang ke supplier, dan
            masuk ke pembukuan lewat `alokasi_biaya` di tiap baris.
          example: "1000000.00"
        id_ekspedisi: { type: integer, format: int64, nullable: true }
        no_resi: { type: string, nullable: true }
        total_koli: { type: string, nullable: true, example: "3.00" }
        tarif_per_koli: { type: string, nullable: true, example: "50000.00" }
        biaya_angkut:
          type: string
          description: >
            `total_koli x tarif_per_koli`, atau `0.00` kalau `ditanggung_supplier`.
          example: "150000.00"
        ditanggung_supplier: { type: boolean }
        metode_alokasi_angkut:
          type: string
          enum: [KOLI, QTY]
          description: >
            Disimpan per dokumen, jadi mengubah metodenya belakangan tidak pernah
            menulis ulang alokasi lama. `KOLI` jatuh ke `QTY` saat seluruh
            `jumlah_koli` nol, supaya tidak membagi dengan nol.
        jenis_pembayaran: { type: string, enum: [TUNAI, KREDIT] }
        status_pembayaran:
          type: string
          enum: [BELUM, SEBAGIAN, LUNAS]
          description: >
            Cache, dihitung ulang dari alokasi POSTED dan retur POSTED. Tidak
            pernah di-set dari form. Modul pembayaran utang yang mengisinya.
        status_penerimaan:
          type: string
          enum: [LENGKAP, KURANG]
          description: >
            Cache atas baris detailnya: `KURANG` kalau ada baris yang diterima
            kurang dari faktur. Dihitung ulang, tidak pernah di-set dari form.
        status: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        detail:
          type: array
          description: Hanya pada endpoint detail. Kuncinya hilang pada list, bukan array kosong.
          items: { $ref: "#/components/schemas/PembelianDetail" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        diajukan_oleh: { type: integer, format: int64, nullable: true }
        diajukan_pada: { type: string, format: date-time, nullable: true }
        disetujui_oleh: { type: integer, format: int64, nullable: true }
        disetujui_pada: { type: string, format: date-time, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        dibatalkan_oleh: { type: integer, format: int64, nullable: true }
        alasan_batal: { type: string, nullable: true }
        alasan_tolak: { type: string, nullable: true }

    PembelianDetail:
      type: object
      description: >
        Satu baris faktur, dengan empat kuantitas dalam dua pasang.
        `qty_faktur`/`qty_dasar` adalah yang tertulis di kertas dan menggerakkan
        utang; `qty_diterima`/`qty_diterima_dasar` adalah hasil hitung fisik dan
        menggerakkan stok. Yang berakhiran `_dasar` dalam satuan dasar produk.
      properties:
        id: { type: integer, format: int64 }
        id_product: { type: integer, format: int64 }
        kode_barang: { type: string }
        nama_product: { type: string }
        qty_faktur: { type: string, example: "100.0000" }
        qty_diterima: { type: string, example: "95.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor_konversi:
          type: integer
          format: int64
          description: >
            Snapshot dari `product_satuan` saat baris ditulis. Master boleh berubah;
            angka ini tidak, atau dokumen lama diam-diam berganti arti.
        qty_dasar: { type: integer, format: int64, example: 100 }
        qty_diterima_dasar: { type: integer, format: int64, example: 95 }
        qty_susulan_dasar:
          type: integer
          format: int64
          description: >
            Jumlah seluruh penerimaan susulan **POSTED** terhadap baris ini. Draft
            tidak dihitung — draft bukan pengiriman.
          example: 0
        selisih_dasar:
          type: integer
          format: int64
          description: >
            `qty_dasar - qty_diterima_dasar`: yang kurang di kiriman pertama. Beku
            setelah dokumen diposting, berapa pun yang menyusul kemudian.
          example: 5
        sisa_dasar:
          type: integer
          format: int64
          description: >
            `selisih_dasar - qty_susulan_dasar`: yang masih jadi tanggungan supplier
            hari ini. Menyusut setiap kali penerimaan susulan diposting.
          example: 5
        qty_retur_dasar:
          type: integer
          format: int64
          description: >
            Jumlah seluruh retur pembelian **POSTED** terhadap baris ini. Draft tidak
            dihitung — draft adalah daftar kemasan, bukan pengiriman.
          example: 0
        qty_dapat_diretur:
          type: integer
          format: int64
          description: >
            `qty_diterima_dasar + qty_susulan_dasar - qty_retur_dasar`: yang masih bisa
            dikirim balik ke supplier.


            Ini sumbu yang berbeda dari tiga angka di atas, dan mencampurnya adalah
            kesalahan yang perlu dihindari: barang yang diretur tetap pernah diterima,
            jadi retur tidak membuat supplier berutang barang lagi dan tidak memberi hak
            atas kiriman susulan. `sisa_dasar` dan `qty_dapat_diretur` bisa sama-sama
            bukan nol pada baris yang sama.
          example: 95
        nama_satuan_dasar: { type: string }
        harga_satuan_input: { type: string, example: "10000.00" }
        diskon_baris: { type: string, example: "0.00" }
        subtotal: { type: string, example: "1000000.00" }
        jumlah_koli:
          type: string
          description: >
            Desimal: satu baris boleh menempati sebagian koli. Diisi petugas gudang
            saat membongkar, jadi biasanya nol saat pertama diinput.
          example: "1.00"
        alokasi_biaya:
          type: string
          description: >
            Bagian ongkir baris ini. Jumlah seluruh baris **persis** sama dengan
            `biaya_angkut`; sisa pembulatan didorong ke baris dengan basis terbesar.
          example: "50000.00"
        harga_pokok_satuan_dasar:
          type: string
          nullable: true
          description: >
            `(subtotal - bagian diskon nota + bagian PPN + alokasi_biaya) /
            qty_dasar` — **bukan** `harga_satuan_input / faktor_konversi`. Null
            sampai dokumen diposting: belum diketahui, bukan hilang.
          example: "10500.0000"
        keterangan_selisih: { type: string, nullable: true }

    PembelianDetailInput:
      type: object
      required: [id_product, id_satuan_input, qty_faktur, harga_satuan_input]
      properties:
        id_product: { type: integer, format: int64, minimum: 1 }
        id_satuan_input:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus sudah terdaftar di `product_satuan` produk itu; kalau tidak,
            400. Tidak ada foreign key yang mengikatnya ke sana.
        qty_faktur: { type: string, example: "100" }
        qty_diterima:
          type: string
          nullable: true
          description: >
            Boleh dikosongkan, dan artinya sama dengan `qty_faktur`. Tidak boleh
            melebihi `qty_faktur`. Berbeda dari `qty_faktur` mewajibkan
            `keterangan_selisih`.
          example: "95"
        harga_satuan_input: { type: string, example: "10000" }
        diskon_baris: { type: string, example: "0" }
        jumlah_koli: { type: string, example: "0" }
        keterangan_selisih: { type: string, nullable: true, maxLength: 500 }

    RiwayatBeli:
      type: object
      description: >
        Pembelian POSTED terakhir satu supplier atas satu produk.


        **Dua harga, dua pertanyaan berbeda.** `harga_satuan_dasar` adalah harga faktur
        per satuan dasar setelah diskon baris — itu yang dibandingkan dengan penawaran
        supplier berikutnya. `harga_pokok_satuan_dasar` adalah harga setelah diskon nota,
        bagian PPN, dan ongkir — itu yang dipakai menilai margin. Melaporkan salah satu
        saja membuat satu dari dua pertanyaan itu tidak terjawab.


        `harga_satuan_input` sengaja bukan angka pembanding: satuannya mengikuti apa yang
        diketik, jadi 12.000/DUS dan 1.000/PCS terlihat jauh berbeda padahal sama. Tetap
        dilaporkan karena itu angka yang tercetak di kertas.
      properties:
        id_supplier: { type: integer, format: int64 }
        nama_supplier: { type: string }
        id_pembelian: { type: integer, format: int64 }
        nomor: { type: string, example: BL/2026/08/0001 }
        tanggal: { type: string, format: date-time }
        no_faktur_supplier: { type: string, nullable: true }
        id_pembelian_detail: { type: integer, format: int64 }
        qty_faktur: { type: string, example: "10.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string, example: DUS }
        faktor_konversi: { type: integer, format: int64, example: 12 }
        qty_dasar: { type: integer, format: int64, example: 120 }
        nama_satuan_dasar: { type: string, example: PCS }
        harga_satuan_input:
          type: string
          description: Per satuan input, seperti tertulis di nota.
          example: "120000.00"
        diskon_baris: { type: string, example: "0.00" }
        subtotal: { type: string, example: "1200000.00" }
        alokasi_biaya: { type: string, example: "60000.00" }
        harga_satuan_dasar:
          type: string
          description: >
            `subtotal / qty_dasar`. Harga faktur per satuan dasar, jadi bisa dibandingkan
            antar supplier yang memakai kemasan berbeda.
          example: "10000.0000"
        harga_pokok_satuan_dasar:
          type: string
          nullable: true
          description: >
            Harga pokok setelah ongkir, disalin dari baris pembeliannya. Tidak pernah
            null pada endpoint ini — hanya dokumen POSTED yang dibaca, dan posting yang
            mengisinya.
          example: "10500.0000"

    SisaPembelian:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nomor: { type: string }
        id_supplier: { type: integer, format: int64 }
        nama_supplier: { type: string }
        status: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        status_penerimaan: { type: string, enum: [LENGKAP, KURANG] }
        baris:
          type: array
          items:
            type: object
            properties:
              id_pembelian_detail: { type: integer, format: int64 }
              id_product: { type: integer, format: int64 }
              kode_barang: { type: string }
              nama_product: { type: string }
              qty_dasar: { type: integer, format: int64 }
              qty_diterima_dasar: { type: integer, format: int64 }
              qty_susulan_dasar: { type: integer, format: int64 }
              sisa_dasar: { type: integer, format: int64 }
              nama_satuan_dasar: { type: string }
              keterangan_selisih: { type: string, nullable: true }

    PenerimaanSusulan:
      type: object
      description: >
        Kiriman kedua untuk barang yang belum datang di kiriman pertama.


        Tidak punya `total`, `ppn`, maupun `status_pembayaran`, karena ia bukan
        tagihan: faktur supplier terbit penuh di kiriman pertama dan sudah dibukukan
        penuh di sana. `total_nilai` adalah nilai barang yang datang terlambat, yang
        dibawa masuk ke persediaan — bukan uang yang terutang.
      properties:
        id: { type: integer, format: int64 }
        nomor:
          type: string
          description: Seri sendiri, terpisah dari pembelian.
          example: PS/2026/08/0001
        tanggal: { type: string, format: date-time }
        id_pembelian: { type: integer, format: int64 }
        nomor_pembelian: { type: string }
        id_supplier:
          type: integer
          format: int64
          description: Disalin dari pembelian, bukan dipilih.
        nama_supplier: { type: string }
        id_ruang:
          type: integer
          format: int64
          description: >
            Disalin dari pembelian. Barang yang perlu pindah ruang setelah diterima
            adalah pekerjaan mutasi, bukan penerimaan.
        nama_ruang: { type: string }
        keterangan: { type: string, nullable: true }
        total_nilai:
          type: string
          description: Nilai barang yang menyusul. Dihitung ulang dari barisnya.
          example: "52500.00"
        status: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        detail:
          type: array
          description: Hanya pada endpoint detail. Kuncinya hilang pada list.
          items: { $ref: "#/components/schemas/PenerimaanSusulanDetail" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        diajukan_oleh: { type: integer, format: int64, nullable: true }
        diajukan_pada: { type: string, format: date-time, nullable: true }
        disetujui_oleh: { type: integer, format: int64, nullable: true }
        disetujui_pada: { type: string, format: date-time, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        dibatalkan_oleh: { type: integer, format: int64, nullable: true }
        alasan_batal: { type: string, nullable: true }
        alasan_tolak: { type: string, nullable: true }

    PenerimaanSusulanDetail:
      type: object
      description: >
        Satu baris, menunjuk baris faktur yang dilengkapinya — produknya adalah
        produk baris itu.
      properties:
        id: { type: integer, format: int64 }
        id_pembelian_detail: { type: integer, format: int64 }
        id_product: { type: integer, format: int64 }
        kode_barang: { type: string }
        nama_product: { type: string }
        qty_input: { type: string, example: "5.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor_konversi:
          type: integer
          format: int64
          description: >
            Snapshot dari `product_satuan` saat baris ditulis. Diambil segar karena
            kuantitasnya adalah hitungan baru dan boleh dalam satuan yang berbeda
            dari yang dipakai faktur.
        qty_dasar: { type: integer, format: int64, example: 5 }
        nama_satuan_dasar: { type: string }
        harga_pokok_satuan_dasar:
          type: string
          description: >
            **Disalin dari baris pembelian**, tidak pernah dihitung ulang dan tidak
            pernah dibaca dari rata-rata bergerak terkini. Harga barang sudah
            ditetapkan faktur; kiriman keduanya tidak mengubahnya. Ini juga yang
            membuat pembelian dan seluruh susulannya berjumlah persis nilai faktur.
          example: "10500.0000"
        nilai:
          type: string
          description: "`qty_dasar x harga_pokok_satuan_dasar`."
          example: "52500.00"

    PenerimaanSusulanDetailInput:
      type: object
      required: [id_pembelian_detail, id_satuan_input, qty_input]
      properties:
        id_pembelian_detail:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus milik pembelian di header, dan harga pokoknya harus sudah terisi
            (yaitu pembeliannya sudah POSTED). Satu baris pembelian hanya boleh
            muncul sekali per dokumen.
        id_satuan_input:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus terdaftar di `product_satuan` produk itu. Boleh berbeda dari satuan
            yang dipakai baris fakturnya — lima pcs kurang dari baris yang diketik
            dalam dus adalah kasus yang wajar.
        qty_input:
          type: string
          description: >
            Tidak boleh melebihi sisa baris itu
            (`qty_dasar - qty_diterima_dasar - Σ susulan POSTED`), setelah dikonversi
            ke satuan dasar. `qty x faktor` wajib bilangan bulat.
          example: "5"

    ReturPembelian:
      type: object
      description: >
        Barang yang dikembalikan ke supplier. Cermin dari penerimaan susulan: sama-sama
        menunjuk baris `pembelian_detail` dan sama-sama menyalin harga pokoknya dari
        sana, arah barangnya saja yang berlawanan.


        Tidak punya `ppn` maupun `status_pembayaran`. Berapa yang dikreditkan supplier
        diselesaikan dengan mereka di atas nota; dokumen ini mencatat apa yang keluar
        dari gudang dan berapa nilainya.
      properties:
        id: { type: integer, format: int64 }
        nomor:
          type: string
          description: Seri sendiri, terpisah dari pembelian dan penerimaan susulan.
          example: RB/2026/08/0001
        tanggal: { type: string, format: date-time }
        id_pembelian: { type: integer, format: int64 }
        nomor_pembelian: { type: string }
        id_supplier:
          type: integer
          format: int64
          description: Disalin dari pembelian, bukan dipilih.
        nama_supplier: { type: string }
        id_ruang:
          type: integer
          format: int64
          description: >
            Disalin dari pembelian — tempat barangnya ditaruh saat datang. Barang yang
            perlu dikembalikan dari ruang lain adalah pekerjaan mutasi lebih dulu.
        nama_ruang: { type: string }
        alasan:
          type: string
          nullable: true
          description: >
            Nullable di skema tetapi wajib diisi aplikasi. Ia satu-satunya catatan kenapa
            barang yang sudah dibayar dikirim balik.
        total:
          type: string
          description: >
            Nilai persediaan yang keluar menurut faktur, dihitung ulang dari barisnya dan
            tidak pernah di-set dari form. **Bukan otomatis sama dengan yang dikreditkan
            supplier**, dan bukan angka yang dicatat kartu stok — lihat
            `harga_pokok_satuan_dasar` pada barisnya.
          example: "1000000.00"
        status: { type: string, enum: [DRAFT, DIAJUKAN, POSTED, BATAL] }
        detail:
          type: array
          description: Hanya pada endpoint detail. Kuncinya hilang pada list.
          items: { $ref: "#/components/schemas/ReturPembelianDetail" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        diajukan_oleh: { type: integer, format: int64, nullable: true }
        diajukan_pada: { type: string, format: date-time, nullable: true }
        disetujui_oleh: { type: integer, format: int64, nullable: true }
        disetujui_pada: { type: string, format: date-time, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        dibatalkan_oleh: { type: integer, format: int64, nullable: true }
        alasan_batal: { type: string, nullable: true }
        alasan_tolak: { type: string, nullable: true }

    ReturPembelianDetail:
      type: object
      description: >
        Satu baris, menunjuk baris faktur yang barangnya masuk lewat sana — produknya
        adalah produk baris itu.
      properties:
        id: { type: integer, format: int64 }
        id_pembelian_detail: { type: integer, format: int64 }
        id_product: { type: integer, format: int64 }
        kode_barang: { type: string }
        nama_product: { type: string }
        qty_input: { type: string, example: "1.0000" }
        id_satuan_input: { type: integer, format: int64 }
        nama_satuan: { type: string }
        faktor_konversi:
          type: integer
          format: int64
          description: >
            Snapshot dari `product_satuan` saat baris ditulis. Diambil segar karena
            kuantitasnya adalah hitungan baru atas barang yang sedang dikemas dan boleh
            dalam satuan yang berbeda dari yang dipakai faktur.
        qty_dasar: { type: integer, format: int64, example: 12 }
        nama_satuan_dasar: { type: string }
        harga_pokok_satuan_dasar:
          type: string
          description: >
            **Disalin dari baris pembelian**, tidak pernah dibaca dari rata-rata bergerak
            terkini. Tanpa itu pembelian dan returnya tidak saling menghapus — dan itulah
            yang menurut migrasi `000005` menjadi alasan kolom ini ada.
          example: "10000.0000"
        nilai:
          type: string
          description: >
            `qty_dasar x harga_pokok_satuan_dasar` — nilai barangnya menurut faktur.
            **Bukan** yang dicatat `kartu_stok` sebagai keluar: trigger menilai setiap
            baris keluar pada rata-rata bergerak yang berlaku saat itu, karena barangnya
            sudah tercampur dengan stok lama sejak ia datang. Dua-duanya jawaban benar
            untuk pertanyaan yang berbeda.
          example: "120000.00"

    ReturPembelianDetailInput:
      type: object
      required: [id_pembelian_detail, id_satuan_input, qty_input]
      properties:
        id_pembelian_detail:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus milik pembelian di header, dan harga pokoknya harus sudah terisi (yaitu
            pembeliannya sudah POSTED). Satu baris pembelian hanya boleh muncul sekali per
            dokumen.
        id_satuan_input:
          type: integer
          format: int64
          minimum: 1
          description: >
            Harus terdaftar di `product_satuan` produk itu. Boleh berbeda dari satuan yang
            dipakai baris fakturnya — satu dus dikembalikan dari baris yang diketik dalam
            pcs adalah kasus yang wajar.
        qty_input:
          type: string
          description: >
            Tidak boleh melebihi yang bisa diretur
            (`qty_diterima_dasar + Σ susulan POSTED − Σ retur POSTED`), setelah dikonversi
            ke satuan dasar. Perhatikan bahwa `qty_dasar` tidak ikut: barang yang tidak
            pernah datang tidak bisa dikirim balik. `qty x faktor` wajib bilangan bulat.
          example: "1"

    Role:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nama: { type: string, example: CASHIER }
        is_aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    User:
      type: object
      description: >
        Tidak punya field password, bahkan hash-nya. Satu-satunya jalan hash
        sampai ke klien adalah kalau seseorang menambahkan fieldnya di sini.
      properties:
        id: { type: integer, format: int64 }
        username: { type: string, example: kasir_pagi }
        email: { type: string, format: email, nullable: true }
        nama_lengkap: { type: string, nullable: true }
        is_aktif: { type: boolean }
        roles:
          type: array
          description: >
            Seluruh role yang dipegang user; satu user boleh punya banyak. Selalu
            array, tidak pernah `null`, jadi `roles.length` aman dibaca di setiap
            baris. Diurutkan berdasarkan nama role.


            Termasuk role yang dipensiunkan setelah diberikan — pemberiannya masih
            nyata dan masih perlu dicabut. Bedakan lewat `is_aktif` di dalamnya.
          items: { $ref: "#/components/schemas/RoleRef" }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }

    RoleRef:
      type: object
      description: >
        Bentuk ringkas role di dalam user. Kolom audit role tidak diulang di setiap
        baris daftar user.
      properties:
        id: { type: integer, format: int64 }
        nama: { type: string, example: CASHIER }
        is_aktif: { type: boolean }

    RoleIDs:
      type: array
      maxItems: 32
      items: { type: integer, format: int64, minimum: 1 }
      description: >
        Id role yang dipegang user. Id yang berulang dianggap satu — `[2, 2]` jelas
        berarti "beri role 2".


        Id yang tidak ada atau rolenya sudah `is_aktif: false` ditolak 400, bukan
        diabaikan diam-diam.
      example: [2, 3]

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      description: >
        Hanya dikirim masuk, sekali. Di-hash dengan bcrypt di lapisan usecase dan
        tidak pernah disimpan, dicatat di log, atau dikembalikan.


        Batas 72 adalah batas masukan bcrypt. Validator menghitung rune sedangkan
        bcrypt menghitung byte, jadi password 72 karakter yang mengandung rune
        multibyte tetap ditolak 400, hanya pesannya yang berbeda.

    PageMetadata:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        total_item: { type: integer, format: int64 }
        total_page: { type: integer, format: int64 }

  responses:
    Error:
      description: Request gagal
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { nullable: true, example: null }
              errors: { type: string, example: "supplier not found" }

    ValidationError:
      description: Payload tidak lolos validasi
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { nullable: true, example: null }
              errors: { type: string, example: "validation failed" }
              validation_errors:
                type: object
                additionalProperties: { type: string }
                example: { "Nama": "required" }
